<script>
{
const D=[{"n":1,"translit":"Ar-Rahmân","fr":"Le Tout-Miséricordieux","sens":"Sa miséricorde est immense et englobe toute la création, croyants comme non-croyants, en ce monde.","coran":"« Ar-Rahmân s'est établi sur le Trône. » — Tâ-Hâ, 20:5","hadith":"« Ceux qui font miséricorde, Ar-Rahmân leur fait miséricorde. Soyez miséricordieux envers ceux qui sont sur terre, Celui qui est au ciel vous fera miséricorde. » — Abû Dâwûd 4941, at-Tirmidhî 1924 (authentique)","rappel":"L'air que tu respires, le cœur qui bat sans que tu y penses : tout cela est Sa miséricorde, avant même que tu ne demandes.","action":"Fais aujourd'hui un acte de douceur envers quelqu'un qui ne s'y attend pas.","ar":"الرَّحْمٰنُ","flag":"","ref":[20,5],"car":"الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ","har":"الرَّاحِمُونَ يَرْحَمُهُمُ الرَّحْمَٰنُ، ارْحَمُوا مَنْ فِي الْأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ"},{"n":2,"translit":"Ar-Rahîm","fr":"Le Très-Miséricordieux","sens":"Sa miséricorde particulière, réservée aux croyants, qui se manifeste surtout dans l'au-delà.","coran":"« Et Il est Miséricordieux envers les croyants. » — Al-Ahzâb, 33:43","hadith":"« Allah a divisé la miséricorde en cent parts. Il en a gardé quatre-vingt-dix-neuf auprès de Lui et en a fait descendre une seule sur terre. C'est par cette part que les créatures s'entraident, au point que la jument soulève son sabot pour ne pas blesser son petit. » — Al-Bukhârî 6000, Muslim 2752","rappel":"Tout l'amour d'une mère pour son enfant n'est qu'une fraction d'un centième de Sa miséricorde. Imagine ce qui t'attend auprès de Lui.","action":"Pense à un péché qui te pèse et demande pardon avec confiance, sans désespérer.","ar":"الرَّحِيمُ","flag":"","ref":[33,43],"car":"وَكَانَ بِالْمُؤْمِنِينَ رَحِيمًا","har":"جَعَلَ اللَّهُ الرَّحْمَةَ مِائَةَ جُزْءٍ، فَأَمْسَكَ عِنْدَهُ تِسْعَةً وَتِسْعِينَ جُزْءًا، وَأَنْزَلَ فِي الْأَرْضِ جُزْءًا وَاحِدًا، فَمِنْ ذَٰلِكَ الْجُزْءِ يَتَرَاحَمُ الْخَلْقُ، حَتَّى تَرْفَعَ الْفَرَسُ حَافِرَهَا عَنْ وَلَدِهَا خَشْيَةَ أَنْ تُصِيبَهُ"},{"n":3,"translit":"Al-Malik","fr":"Le Roi, le Souverain","sens":"Il possède tout, dispose de tout, et Son règne n'a ni début ni fin.","coran":"« Que soit exalté Allah, le Vrai Souverain ! » — Tâ-Hâ, 20:114","hadith":"Le Jour de la Résurrection, Allah saisira la terre et pliera les cieux, puis dira : « C'est Moi le Roi ! Où sont les rois de la terre ? » — Al-Bukhârî 4812, Muslim 2787","rappel":"Les rois passent, les empires tombent. Celui qui sert le vrai Roi n'est esclave de personne d'autre.","action":"Avant une décision, demande-toi : « Est-ce que cela plaît au Roi des rois ? »","ar":"الْمَلِكُ","flag":"","ref":[20,114],"car":"فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ","har":"يَقْبِضُ اللَّهُ الْأَرْضَ وَيَطْوِي السَّمَاوَاتِ بِيَمِينِهِ، ثُمَّ يَقُولُ: أَنَا الْمَلِكُ، أَيْنَ مُلُوكُ الْأَرْضِ"},{"n":4,"translit":"Al-Quddûs","fr":"Le Pur, le Saint","sens":"Il est exempt de tout défaut, de toute imperfection et de tout ce qui ne convient pas à Sa majesté.","coran":"« Ce qui est dans les cieux et sur la terre glorifie Allah, le Souverain, le Pur, le Puissant, le Sage. » — Al-Jumu'a, 62:1","hadith":"Après le witr, le Prophète ﷺ disait trois fois : « Subhâna l-Maliki l-Quddûs » (Gloire au Roi, le Pur). — an-Nasâ'î 1740, Abû Dâwûd 1430 (authentique)","rappel":"Celui qui aime Al-Quddûs cherche à purifier son cœur de la jalousie, de l'orgueil et de la rancune.","action":"Ce soir après le witr, dis trois fois « Subhâna l-Maliki l-Quddûs ».","ar":"الْقُدُّوسُ","flag":"","ref":[62,1],"car":"يُسَبِّحُ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ الْمَلِكِ الْقُدُّوسِ الْعَزِيزِ الْحَكِيمِ","har":"سُبْحَانَ الْمَلِكِ الْقُدُّوسِ"},{"n":5,"translit":"As-Salâm","fr":"La Paix, Celui qui est sain de tout défaut","sens":"Il est la Paix et la source de toute paix ; Il est préservé de toute faiblesse, et le Paradis est appelé « la Demeure de la Paix ».","coran":"« Allah appelle à la Demeure de la Paix. » — Yûnus, 10:25","hadith":"Après chaque prière, le Prophète ﷺ disait : « Allahumma anta s-Salâm, wa minka s-salâm, tabârakta yâ dhâ l-jalâli wa l-ikrâm. » — Muslim 591","rappel":"Chaque « As-salâmu 'alaykum » que tu donnes porte un nom d'Allah. Répands-le, c'est un chemin vers le Paradis.","action":"Salue chaque personne que tu croises aujourd'hui, même celles que tu ne connais pas.","ar":"السَّلَامُ","flag":"","ref":[10,25],"car":"وَاللَّهُ يَدْعُو إِلَىٰ دَارِ السَّلَامِ","har":"اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ"},{"n":6,"translit":"Al-Mu'min","fr":"Celui qui accorde la sécurité, le Fidèle","sens":"Il rassure Ses serviteurs, leur donne la sécurité, et confirme la véracité de Ses prophètes.","coran":"« C'est Lui Allah… le Souverain, le Pur, la Paix, Celui qui accorde la sécurité, le Prédominant. » — Al-Hashr, 59:23","rappel":"La vraie sécurité ne vient ni de l'argent ni des gens. Allah promet la sécurité à ceux qui croient sans mêler leur foi d'injustice (Al-An-'âm, 6:82).","action":"Quand une peur te traverse aujourd'hui, dis : « Hasbiya Allah » (Allah me suffit).","ar":"الْمُؤْمِنُ","flag":"","ref":[59,23],"car":"هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ"},{"n":7,"translit":"Al-Muhaymin","fr":"Le Préservateur, Celui qui veille sur tout","sens":"Il observe, protège et domine chaque chose ; rien n'échappe à Sa garde.","coran":"« …le Préservateur, le Puissant, le Contraignant, l'Orgueilleux. » — Al-Hashr, 59:23","rappel":"Tu n'es jamais seul, ni dans la nuit, ni dans l'épreuve. Celui qui veille sur l'univers veille aussi sur toi.","action":"Avant de dormir, confie à Allah ta famille et tes proches par une doua.","ar":"الْمُهَيْمِنُ","flag":"","ref":[59,23],"car":"الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ"},{"n":8,"translit":"Al-'Azîz","fr":"Le Tout-Puissant, l'Invincible","sens":"Il est inaccessible à toute défaite, rien ne Lui résiste, et toute la puissance Lui appartient.","coran":"« Quiconque veut la puissance, alors toute la puissance appartient à Allah. » — Fâtir, 35:10","rappel":"La vraie dignité ('izza) ne se trouve pas auprès des gens, mais dans l'obéissance à Al-'Azîz.","action":"Refuse aujourd'hui une petite chose qui te ferait perdre ta dignité devant Allah.","ar":"الْعَزِيزُ","flag":"","ref":[35,10],"car":"مَنْ كَانَ يُرِيدُ الْعِزَّةَ فَلِلَّهِ الْعِزَّةُ جَمِيعًا"},{"n":9,"translit":"Al-Jabbâr","fr":"Le Contraignant, Celui qui répare","sens":"Il impose Sa volonté à toute chose, et Il répare (jabr) les cœurs brisés, comble les manques des faibles.","coran":"« …le Préservateur, le Puissant, le Contraignant… » — Al-Hashr, 59:23","hadith":"Entre les deux prosternations, le Prophète ﷺ disait notamment : « …wajburnî » (et répare-moi). — at-Tirmidhî 284, jugé hasan par plusieurs savants","rappel":"Ton cœur est brisé ? Al-Jabbâr est le seul capable de le recoller, mieux qu'avant.","action":"Entre les deux sujûd, dis : « Rabbi ghfir lî, warhamnî, wajburnî. »","ar":"الْجَبَّارُ","flag":"","ref":[59,23],"car":"الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ","har":"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاجْبُرْنِي، وَاهْدِنِي، وَارْزُقْنِي"},{"n":10,"translit":"Al-Mutakabbir","fr":"Le Suprêmement Grand","sens":"Il possède la grandeur absolue ; la fierté ne convient qu'à Lui.","coran":"« …l'Orgueilleux. Gloire à Allah, Il transcende ce qu'ils Lui associent. » — Al-Hashr, 59:23","hadith":"Allah dit : « La grandeur est Mon manteau et la majesté est Mon vêtement ; quiconque Me dispute l'un d'eux, Je le châtierai. » — Muslim 2620, Abû Dâwûd 4090","rappel":"La grandeur appartient à Allah seul ; l'humilité est la parure du croyant.","action":"Reconnais aujourd'hui une erreur devant quelqu'un, sans te justifier.","ar":"الْمُتَكَبِّرُ","flag":"","ref":[59,23],"car":"الْمُتَكَبِّرُ ۚ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ","har":"الْعِزُّ إِزَارُهُ، وَالْكِبْرِيَاءُ رِدَاؤُهُ، فَمَنْ يُنَازِعُنِي عَذَّبْتُهُ"},{"n":11,"translit":"Al-Khâliq","fr":"Le Créateur","sens":"Il crée toute chose à partir du néant, selon une mesure parfaite.","coran":"« C'est Lui Allah, le Créateur, Celui qui donne un commencement à toute chose, le Formateur. À Lui les plus beaux noms. » — Al-Hashr, 59:24","rappel":"Celui qui t'a créé sans que tu ne demandes rien ne t'abandonnera pas quand tu L'implores.","action":"Regarde le ciel quelques minutes et médite sur une seule création d'Allah.","ar":"الْخَالِقُ","flag":"","ref":[59,24],"car":"هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ"},{"n":12,"translit":"Al-Bâri'","fr":"Celui qui donne existence, le Producteur","sens":"Il fait exister les créatures, distinctes les unes des autres, sans défaut ni désordre.","coran":"« …le Créateur, Celui qui donne un commencement à toute chose… » — Al-Hashr, 59:24","rappel":"Aucun être humain n'est identique à un autre : tes empreintes, ta voix, ton cœur sont uniques, voulus par Al-Bâri'.","action":"Remercie Allah pour une qualité qu'Il t'a donnée et que tu oublies souvent.","ar":"الْبَارِئُ","flag":"","ref":[59,24],"car":"هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ"},{"n":13,"translit":"Al-Musawwir","fr":"Le Formateur","sens":"Il donne à chaque créature sa forme et son apparence, comme Il le veut.","coran":"« C'est Lui qui vous donne forme dans les matrices comme Il veut. » — Âl 'Imrân, 3:6","rappel":"Ton visage a été façonné par Allah : ne le méprise pas et ne te moque pas de celui des autres.","action":"Dis : « Allahumma ahsanta khalqî fa-ahsin khuluqî » (Ô Allah, Tu as embelli ma création, embellis aussi mon caractère). — Ahmad 3823, Ibn Hibbân (authentique)","ar":"الْمُصَوِّرُ","flag":"","ref":[3,6],"car":"هُوَ الَّذِي يُصَوِّرُكُمْ فِي الْأَرْحَامِ كَيْفَ يَشَاءُ"},{"n":14,"translit":"Al-Ghaffâr","fr":"Celui qui pardonne sans cesse","sens":"Il pardonne encore et encore, aussi souvent que le serviteur revient à Lui.","coran":"« Et Je suis Grand Pardonneur pour celui qui se repent, croit, fait le bien puis se met sur le bon chemin. » — Tâ-Hâ, 20:82","hadith":"Le sayyid al-istighfâr, le meilleur des pardons, se termine par : « Pardonne-moi, car nul ne pardonne les péchés si ce n'est Toi. » Celui qui le dit avec conviction le matin et meurt ce jour-là entre au Paradis. — Al-Bukhârî 6306","rappel":"Le nom vient de ghafara : couvrir. Allah ne fait pas qu'effacer, Il couvre et protège ta dignité.","action":"Apprends le sayyid al-istighfâr et récite-le matin et soir.","ar":"الْغَفَّارُ","flag":"","ref":[20,82],"car":"وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ","har":"فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ"},{"n":15,"translit":"Al-Qahhâr","fr":"Le Dominateur suprême","sens":"Toutes les créatures sont soumises à Sa volonté ; rien ne Lui résiste.","coran":"« À qui appartient la royauté aujourd'hui ? À Allah, l'Unique, le Dominateur. » — Ghâfir, 40:16","rappel":"Ce qui t'écrase aujourd'hui (une peur, un tyran, une passion) est lui-même soumis à Al-Qahhâr.","action":"Combats aujourd'hui une mauvaise habitude, en demandant à Al-Qahhâr de t'aider à la dominer.","ar":"الْقَهَّارُ","flag":"","ref":[40,16],"car":"لِمَنِ الْمُلْكُ الْيَوْمَ ۖ لِلَّهِ الْوَاحِدِ الْقَهَّارِ"},{"n":16,"translit":"Al-Wahhâb","fr":"Le Donateur généreux","sens":"Il donne sans compter, sans contrepartie et sans attendre qu'on le mérite.","coran":"« Seigneur, ne laisse pas dévier nos cœurs après nous avoir guidés, et accorde-nous Ta miséricorde. C'est Toi, certes, le Grand Donateur. » — Âl 'Imrân, 3:8","rappel":"Sulaymân, Zakariyyâ, Ibrâhîm : les prophètes ont tous demandé à Al-Wahhâb ce qui semblait impossible, et Il a donné.","action":"Apprends et récite la doua d'Âl 'Imrân 3:8 pour la stabilité de ton cœur.","ar":"الْوَهَّابُ","flag":"","ref":[3,8],"car":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً ۚ إِنَّكَ أَنْتَ الْوَهَّابُ"},{"n":17,"translit":"Ar-Razzâq","fr":"Celui qui pourvoit à la subsistance","sens":"Il nourrit toutes les créatures, et Il donne aussi la subsistance du cœur : la foi, la science, la paix.","coran":"« Allah est le Grand Pourvoyeur, le Détenteur de la force, l'Inébranlable. » — Adh-Dhâriyât, 51:58","hadith":"« Si vous placiez vraiment votre confiance en Allah, Il vous nourrirait comme Il nourrit les oiseaux : ils partent le matin le ventre vide et reviennent le soir rassasiés. » — at-Tirmidhî 2344 (authentique)","rappel":"Ta subsistance a été écrite avant ta naissance : cherche-la par le licite, sans angoisse.","action":"Donne une aumône, même petite : elle n'a jamais diminué un bien.","ar":"الرَّزَّاقُ","flag":"","ref":[51,58],"car":"إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ","har":"لَوْ أَنَّكُمْ كُنْتُمْ تَوَكَّلُونَ عَلَى اللَّهِ حَقَّ تَوَكُّلِهِ لَرُزِقْتُمْ كَمَا تُرْزَقُ الطَّيْرُ، تَغْدُو خِمَاصًا وَتَرُوحُ بِطَانًا"},{"n":18,"translit":"Al-Fattâh","fr":"Celui qui ouvre, le Juge","sens":"Il ouvre les portes du bien, de la subsistance et de la miséricorde, et Il tranche entre les gens avec vérité.","coran":"« Puis Il tranchera entre nous avec la vérité. C'est Lui le Grand Juge, l'Omniscient. » — Saba', 34:26","hadith":"En entrant à la mosquée, le Prophète ﷺ enseignait de dire : « Allahumma ftah lî abwâba rahmatik » (Ô Allah, ouvre-moi les portes de Ta miséricorde). — Muslim 713","rappel":"Aucune porte n'est fermée pour Celui qui frappe à celle d'Al-Fattâh.","action":"Pour une situation bloquée, invoque : « Yâ Fattâh, ouvre-moi une issue. »","ar":"الْفَتَّاحُ","flag":"","ref":[34,26],"car":"ثُمَّ يَفْتَحُ بَيْنَنَا بِالْحَقِّ وَهُوَ الْفَتَّاحُ الْعَلِيمُ","har":"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ"},{"n":19,"translit":"Al-'Alîm","fr":"L'Omniscient","sens":"Sa science embrasse tout : le passé, le présent, l'avenir, le visible et le caché.","coran":"« C'est Lui qui détient les clés de l'inconnu ; nul autre que Lui ne les connaît. Pas une feuille ne tombe sans qu'Il le sache. » — Al-An-'âm, 6:59","hadith":"Dans la prière de consultation (istikhâra) : « Tu sais et je ne sais pas, et c'est Toi le Grand Connaisseur de l'inconnu. » — Al-Bukhârî 1166","rappel":"Allah connaît ta douleur avant même que tu ne l'exprimes. Tes larmes silencieuses ne sont jamais perdues.","action":"Pour ta prochaine décision importante, fais la prière d'istikhâra.","ar":"الْعَلِيمُ","flag":"","ref":[6,59],"car":"وَعِنْدَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ … وَمَا تَسْقُطُ مِنْ وَرَقَةٍ إِلَّا يَعْلَمُهَا","har":"فَإِنَّكَ تَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ"},{"n":20,"translit":"Al-Qâbid","fr":"Celui qui restreint","sens":"Il resserre la subsistance ou le cœur de qui Il veut, par sagesse. Ce nom se dit avec son opposé, Al-Bâsit (n° 21).","coran":"« Allah restreint et étend (Ses dons). Et c'est à Lui que vous serez ramenés. » — Al-Baqara, 2:245","hadith":"« C'est Allah qui fixe les prix, Celui qui restreint et qui étend, le Pourvoyeur. » — Abû Dâwûd 3451, at-Tirmidhî 1314 (authentique)","rappel":"Un moment de gêne n'est pas un abandon : c'est souvent la préparation d'une ouverture.","action":"Dans un moment de manque, dis « Alhamdulillah » avant de te plaindre.","ar":"الْقَابِضُ","flag":"","ref":[2,245],"car":"وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ","har":"إِنَّ اللَّهَ هُوَ الْمُسَعِّرُ الْقَابِضُ الْبَاسِطُ الرَّازِقُ"},{"n":21,"translit":"Al-Bâsit","fr":"Celui qui étend, qui accorde largement","sens":"Il élargit la subsistance, la joie et la paix du cœur pour qui Il veut. Il va avec Al-Qâbid (n° 20).","coran":"« Allah étend la subsistance à qui Il veut parmi Ses serviteurs, ou la restreint. » — Al-'Ankabût, 29:62","rappel":"L'aisance aussi est une épreuve : est-ce qu'elle te rapproche d'Allah ou t'en éloigne ?","action":"Partage une part d'une bénédiction que tu as reçue cette semaine.","ar":"الْبَاسِطُ","flag":"","ref":[29,62],"car":"اللَّهُ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ لَهُ"},{"n":22,"translit":"Al-Khâfid","fr":"Celui qui abaisse","sens":"Il abaisse les orgueilleux et les injustes. Ce nom fait partie de ceux dont l'usage est discuté par les savants ; on le mentionne toujours avec son opposé, Ar-Râfi'.","coran":"Au sujet du Jour dernier : « Il abaissera (les uns) et élèvera (les autres). » — Al-Wâqi'a, 56:3","rappel":"Celui qui s'élève sur les autres par orgueil sera abaissé ; celui qui s'abaisse pour Allah sera élevé.","action":"Rends un service discret à quelqu'un que tu considères « en dessous » de toi.","ar":"الْخَافِضُ","flag":"disc","ref":[56,3],"car":"خَافِضَةٌ رَافِعَةٌ"},{"n":23,"translit":"Ar-Râfi'","fr":"Celui qui élève","sens":"Il élève en degrés les croyants, les savants et les humbles.","coran":"« Allah élèvera en degrés ceux d'entre vous qui ont cru et ceux qui ont reçu la science. » — Al-Mujâdala, 58:11","hadith":"« Personne ne s'humilie pour Allah sans qu'Allah ne l'élève. » — Muslim 2588","rappel":"Le chemin vers le haut passe par l'humilité et la science.","action":"Apprends aujourd'hui un verset ou un hadith nouveau.","ar":"الرَّافِعُ","flag":"","ref":[58,11],"car":"يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ","har":"وَمَا تَوَاضَعَ أَحَدٌ لِلَّهِ إِلَّا رَفَعَهُ اللَّهُ"},{"n":24,"translit":"Al-Mu'izz","fr":"Celui qui donne la puissance et l'honneur","sens":"C'est Lui qui accorde la dignité et la force à qui Il veut.","coran":"« Tu donnes la puissance à qui Tu veux et Tu humilies qui Tu veux. Le bien est dans Ta main. » — Âl 'Imrân, 3:26","rappel":"'Umar disait en substance : nous étions un peuple humble, Allah nous a honorés par l'islam ; si nous cherchons l'honneur ailleurs, Allah nous humiliera.","action":"Affiche ta foi avec fierté et douceur, sans honte.","ar":"الْمُعِزُّ","flag":"","ref":[3,26],"car":"وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ ۖ بِيَدِكَ الْخَيْرُ"},{"n":25,"translit":"Al-Mudhill","fr":"Celui qui humilie","sens":"Il humilie l'orgueil des tyrans et de ceux qui se détournent de Lui. Nom discuté par les savants, toujours mentionné avec Al-Mu'izz.","coran":"« …et Tu humilies qui Tu veux. » — Âl 'Imrân, 3:26","rappel":"Aucun tyran n'est hors d'atteinte : Pharaon s'est cru dieu et a été englouti.","action":"Demande à Allah de te préserver de l'humiliation : « Allahumma lâ tukhzinî » (ne me couvre pas de honte).","ar":"الْمُذِلُّ","flag":"disc","ref":[3,26],"car":"وَتُذِلُّ مَنْ تَشَاءُ"},{"n":26,"translit":"As-Samî'","fr":"Celui qui entend tout","sens":"Il entend chaque voix, dans chaque langue, même le murmure du cœur.","coran":"« Rien n'est semblable à Lui, et c'est Lui l'Audient, le Clairvoyant. » — Ash-Shûrâ, 42:11","hadith":"« Ménagez-vous ! Vous n'invoquez ni un sourd ni un absent : vous invoquez Celui qui entend tout, qui est proche. » — Al-Bukhârî 2992, Muslim 2704","rappel":"Pas besoin de crier ni d'avoir les bons mots : Il entend même ce que tu n'oses pas dire.","action":"Surveille ta langue aujourd'hui : chaque mot est entendu par As-Samî'.","ar":"السَّمِيعُ","flag":"","ref":[42,11],"car":"لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ","har":"ارْبَعُوا عَلَى أَنْفُسِكُمْ، فَإِنَّكُمْ لَا تَدْعُونَ أَصَمَّ وَلَا غَائِبًا، إِنَّكُمْ تَدْعُونَ سَمِيعًا قَرِيبًا"},{"n":27,"translit":"Al-Basîr","fr":"Le Clairvoyant","sens":"Il voit tout, le visible et l'invisible, même la fourmi noire sur le rocher noir dans la nuit noire.","coran":"« Ne sait-il pas qu'Allah voit ? » — Al-'Alaq, 96:14","rappel":"Allah voit tes efforts que personne ne remarque. Il voit aussi tes erreurs : reste vigilant.","action":"Fais une bonne action que personne ne verra, seulement pour Al-Basîr.","ar":"الْبَصِيرُ","flag":"","ref":[96,14],"car":"أَلَمْ يَعْلَمْ بِأَنَّ اللَّهَ يَرَىٰ"},{"n":28,"translit":"Al-Hakam","fr":"Le Juge, l'Arbitre","sens":"Il juge entre Ses serviteurs avec une justice parfaite ; le jugement Lui appartient.","coran":"« Chercherais-je un autre juge qu'Allah ? » — Al-An-'âm, 6:114","hadith":"Le Prophète ﷺ dit à un homme surnommé Abû l-Hakam : « C'est Allah qui est Al-Hakam, et c'est à Lui que revient le jugement. » — Abû Dâwûd 4955 (authentique)","rappel":"Quand on t'a fait du tort, rappelle-toi : le dossier n'est pas clos, Al-Hakam jugera.","action":"Dans un conflit, sois juste même envers celui que tu n'aimes pas.","ar":"الْحَكَمُ","flag":"","ref":[6,114],"car":"أَفَغَيْرَ اللَّهِ أَبْتَغِي حَكَمًا","har":"إِنَّ اللَّهَ هُوَ الْحَكَمُ، وَإِلَيْهِ الْحُكْمُ"},{"n":29,"translit":"Al-'Adl","fr":"Le Juste","sens":"Sa justice est absolue : Il ne lèse personne, même du poids d'un atome. Ce nom vient de la liste traditionnelle ; la justice d'Allah, elle, est affirmée partout dans le Coran.","coran":"« Certes, Allah ne lèse personne, fût-ce du poids d'un atome. » — An-Nisâ', 4:40","hadith":"Allah dit : « Ô Mes serviteurs, Je Me suis interdit l'injustice et Je l'ai rendue interdite entre vous ; ne soyez donc pas injustes les uns envers les autres. » — Muslim 2577","rappel":"Si Allah s'est interdit l'injustice, comment pourrions-nous nous la permettre ?","action":"Répare une petite injustice que tu as commise (une parole, une dette, un oubli).","ar":"الْعَدْلُ","flag":"trad","ref":[4,40],"car":"إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ","har":"يَا عِبَادِي إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا، فَلَا تَظَالَمُوا"},{"n":30,"translit":"Al-Latîf","fr":"Le Doux, le Subtil","sens":"Il connaît les choses les plus fines et fait parvenir le bien à Ses serviteurs par des chemins qu'ils ne voient pas.","coran":"« Allah est plein de douceur envers Ses serviteurs ; Il pourvoit qui Il veut. » — Ash-Shûrâ, 42:19","rappel":"L'histoire de Yûsuf : le puits, l'esclavage, la prison… et au bout, le trône. Yûsuf conclut : « Mon Seigneur est doux pour ce qu'Il veut » (Yûsuf, 12:100).","action":"Repense à une épreuve passée et cherche la douceur d'Allah cachée dedans.","ar":"اللَّطِيفُ","flag":"","ref":[42,19],"car":"اللَّهُ لَطِيفٌ بِعِبَادِهِ يَرْزُقُ مَنْ يَشَاءُ"},{"n":31,"translit":"Al-Khabîr","fr":"Le Parfaitement Informé","sens":"Il connaît le fond des choses, les intentions cachées et les secrets des cœurs.","coran":"« Ne connaît-Il pas ce qu'Il a créé, alors que c'est Lui le Doux, le Parfaitement Informé ? » — Al-Mulk, 67:14","rappel":"Les gens jugent l'extérieur ; Allah connaît l'intention. Purifie la tienne.","action":"Avant chaque action importante aujourd'hui, renouvelle ton intention pour Allah.","ar":"الْخَبِيرُ","flag":"","ref":[67,14],"car":"أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ"},{"n":32,"translit":"Al-Halîm","fr":"Le Longanime, l'Indulgent","sens":"Il voit les péchés mais ne se hâte pas de punir ; Il laisse le temps de revenir.","coran":"« Allah est Pardonneur et Longanime. » — Al-Baqara, 2:225","hadith":"Dans l'angoisse, le Prophète ﷺ disait : « Lâ ilâha illa Llâhu l-'Azîmu l-Halîm… » (Nulle divinité sauf Allah, l'Immense, le Longanime). — Al-Bukhârî 6346, Muslim 2730","rappel":"Si Allah ne nous punissait pas sur-le-champ, c'est par patience, pas par oubli. Profite de ce délai.","action":"Reste calme face à une provocation aujourd'hui, par amour pour Al-Halîm.","ar":"الْحَلِيمُ","flag":"","ref":[2,225],"car":"وَاللَّهُ غَفُورٌ حَلِيمٌ","har":"لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ"},{"n":33,"translit":"Al-'Azîm","fr":"L'Immense, le Magnifique","sens":"Sa grandeur dépasse tout ce que l'esprit peut concevoir.","coran":"« …et Il est le Très-Haut, l'Immense. » — Al-Baqara, 2:255 (Âyat al-Kursî)","hadith":"« Deux paroles légères sur la langue, lourdes dans la balance, aimées par Ar-Rahmân : Subhâna Llâhi wa bi-hamdih, Subhâna Llâhi l-'Azîm. » — Al-Bukhârî 6406, Muslim 2694","rappel":"En rukû', tu dis « Subhâna Rabbiya l-'Azîm » : tu te courbes devant l'Immense. Le dis-tu avec présence ?","action":"Récite 100 fois les deux paroles légères dans la journée.","ar":"الْعَظِيمُ","flag":"","ref":[2,255],"car":"وَهُوَ الْعَلِيُّ الْعَظِيمُ","har":"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَٰنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ"},{"n":34,"translit":"Al-Ghafûr","fr":"Le Pardonneur","sens":"Son pardon est immense, il couvre les péchés les plus lourds.","coran":"« Ô Mes serviteurs qui avez commis des excès à votre propre détriment, ne désespérez pas de la miséricorde d'Allah. Allah pardonne tous les péchés. » — Az-Zumar, 39:53","hadith":"Allah dit : « Ô fils d'Adam, si tes péchés atteignaient les nuages du ciel, puis que tu Me demandais pardon, Je te pardonnerais sans M'en soucier. » — at-Tirmidhî 3540 (hasan)","rappel":"Le désespoir est un piège de Shaytân. Aucun péché n'est plus grand que le pardon d'Allah.","action":"Dis 100 fois « Astaghfirullah » aujourd'hui, comme le faisait le Prophète ﷺ .","ar":"الْغَفُورُ","flag":"","ref":[39,53],"car":"قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنْفُسِهِمْ لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا","har":"يَا ابْنَ آدَمَ، لَوْ بَلَغَتْ ذُنُوبُكَ عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتَنِي غَفَرْتُ لَكَ وَلَا أُبَالِي"},{"n":35,"translit":"Ash-Shakûr","fr":"Le Reconnaissant","sens":"Il récompense largement le peu, et multiplie les bonnes actions sincères.","coran":"« Notre Seigneur est certes Pardonneur et Reconnaissant. » — Fâtir, 35:34","hadith":"Un homme assoiffé donna à boire à un chien qui haletait de soif ; Allah le remercia pour cela et lui pardonna. — Al-Bukhârî 2363, Muslim 2244","rappel":"Aucune bonne action n'est trop petite pour Ash-Shakûr. Un sourire, un verre d'eau peuvent te sauver.","action":"Remercie aujourd'hui une personne qui t'aide sans que tu le lui dises d'habitude.","ar":"الشَّكُورُ","flag":"","ref":[35,34],"car":"إِنَّ رَبَّنَا لَغَفُورٌ شَكُورٌ","har":"… فَسَقَى الْكَلْبَ، فَشَكَرَ اللَّهُ لَهُ فَغَفَرَ لَهُ"},{"n":36,"translit":"Al-'Aliyy","fr":"Le Très-Haut","sens":"Il est au-dessus de toute chose, par Son essence, Sa puissance et Sa valeur.","coran":"« …et Il est le Très-Haut, l'Immense. » — Al-Baqara, 2:255","hadith":"En sujûd, le Prophète ﷺ disait : « Subhâna Rabbiya l-A'lâ » (Gloire à mon Seigneur, le Très-Haut). — Muslim 772","rappel":"C'est au moment où ton front touche le sol que tu es le plus proche du Très-Haut.","action":"Prolonge ton sujûd aujourd'hui et fais-y une doua sincère.","ar":"الْعَلِيُّ","flag":"","ref":[2,255],"car":"وَهُوَ الْعَلِيُّ الْعَظِيمُ","har":"سُبْحَانَ رَبِّيَ الْأَعْلَى"},{"n":37,"translit":"Al-Kabîr","fr":"Le Grand","sens":"Il est plus grand que tout : toute grandeur créée est minuscule devant Lui.","coran":"« Le Connaisseur de l'invisible et du visible, le Grand, le Très-Haut. » — Ar-Ra'd, 13:9","rappel":"« Allahu akbar » : Allah est plus grand que ton problème, que ta peur, que ton chagrin.","action":"Quand quelque chose t'inquiète, dis « Allahu akbar » en pensant à son sens.","ar":"الْكَبِيرُ","flag":"","ref":[13,9],"car":"عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرُ الْمُتَعَالِ"},{"n":38,"translit":"Al-Hafîz","fr":"Le Gardien","sens":"Il préserve les cieux, la terre, les œuvres des serviteurs et ceux qui Le préservent.","coran":"« Allah est le meilleur gardien, et Il est le plus Miséricordieux des miséricordieux. » — Yûsuf, 12:64","hadith":"« Préserve Allah, Il te préservera. Préserve Allah, tu Le trouveras devant toi. » — at-Tirmidhî 2516 (authentique)","rappel":"Préserve tes prières, ta langue et ton regard : Allah préservera ta famille, ta foi et ton avenir.","action":"Récite l'Âyat al-Kursî avant de dormir : un gardien d'Allah reste avec toi jusqu'au matin (Al-Bukhârî 2311).","ar":"الْحَفِيظُ","flag":"","ref":[12,64],"car":"فَاللَّهُ خَيْرٌ حَافِظًا ۖ وَهُوَ أَرْحَمُ الرَّاحِمِينَ","har":"احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ"},{"n":39,"translit":"Al-Muqît","fr":"Celui qui nourrit et maintient","sens":"Il donne à chaque créature sa nourriture et ce qui la maintient en vie, et Il veille sur tout.","coran":"« Et Allah veille et pourvoit à toute chose. » — An-Nisâ', 4:85","rappel":"Ton cœur aussi a besoin de nourriture : le Coran, le dhikr, la prière.","action":"Dis « Bismillah » avant de manger et « Alhamdulillah » après chaque repas.","ar":"الْمُقِيتُ","flag":"","ref":[4,85],"car":"وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُقِيتًا"},{"n":40,"translit":"Al-Hasîb","fr":"Celui qui suffit, Celui qui compte","sens":"Il suffit à celui qui compte sur Lui, et Il tiendra compte de chaque acte.","coran":"« Et Allah suffit pour tenir le compte. » — An-Nisâ', 4:6","rappel":"Fais ton propre compte avant le Jour des comptes : qu'as-tu fait aujourd'hui pour ton au-delà ?","action":"Ce soir, prends deux minutes pour faire le bilan de ta journée.","ar":"الْحَسِيبُ","flag":"","ref":[4,6],"car":"وَكَفَىٰ بِاللَّهِ حَسِيبًا"},{"n":41,"translit":"Al-Jalîl","fr":"Le Majestueux","sens":"Il possède toutes les qualités de majesté et de grandeur. Ce nom vient de la liste traditionnelle ; dans le Coran, on trouve « Dhû l-Jalâl », le Détenteur de la majesté.","coran":"« Seule subsistera la Face de ton Seigneur, plein de majesté et de générosité. » — Ar-Rahmân, 55:27","rappel":"La majesté d'Allah inspire à la fois la crainte respectueuse et l'émerveillement.","action":"Récite la sourate Ar-Rahmân en méditant le refrain : « Lequel des bienfaits de votre Seigneur nierez-vous ? »","ar":"الْجَلِيلُ","flag":"trad","ref":[55,27],"car":"وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ"},{"n":42,"translit":"Al-Karîm","fr":"Le Généreux, le Noble","sens":"Il donne sans qu'on Lui demande, plus qu'on ne mérite, et pardonne quand Il pourrait punir.","coran":"« Ô homme ! Qu'est-ce qui t'a trompé au sujet de ton Seigneur, le Généreux ? » — Al-Infitâr, 82:6","rappel":"Le Généreux ne ferme jamais Sa porte. C'est nous qui oublions d'y frapper.","action":"Sois généreux aujourd'hui : de ton temps, de ton sourire ou de ton argent.","ar":"الْكَرِيمُ","flag":"","ref":[82,6],"car":"يَا أَيُّهَا الْإِنْسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ"},{"n":43,"translit":"Ar-Raqîb","fr":"L'Observateur vigilant","sens":"Il observe en permanence chaque pensée, chaque parole, chaque geste.","coran":"« Certes, Allah vous observe parfaitement. » — An-Nisâ', 4:1","hadith":"L'excellence (ihsân) : « C'est que tu adores Allah comme si tu Le voyais ; car si tu ne Le vois pas, Lui te voit. » — Al-Bukhârî 50, Muslim 8","rappel":"Celui qui se sait observé par Allah n'a plus besoin du regard des gens.","action":"Quand tu es seul aujourd'hui, rappelle-toi : Ar-Raqîb est là.","ar":"الرَّقِيبُ","flag":"","ref":[4,1],"car":"إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا","har":"أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ"},{"n":44,"translit":"Al-Mujîb","fr":"Celui qui répond aux invocations","sens":"Il répond à celui qui L'invoque, de la meilleure manière et au meilleur moment.","coran":"« Quand Mes serviteurs t'interrogent sur Moi, Je suis tout proche : Je réponds à l'appel de celui qui M'invoque quand il M'invoque. » — Al-Baqara, 2:186","hadith":"« Votre Seigneur est pudique et généreux : Il a honte, quand Son serviteur lève les mains vers Lui, de les lui rendre vides. » — Abû Dâwûd 1488, at-Tirmidhî 3556 (authentique)","rappel":"Toute doua est exaucée : soit tu obtiens ce que tu demandes, soit un mal est écarté de toi, soit elle t'est gardée pour l'au-delà (Ahmad 11133, chaîne jugée bonne).","action":"Fais une doua les mains levées, avec certitude, dans le dernier tiers de la nuit si tu peux.","ar":"الْمُجِيبُ","flag":"","ref":[2,186],"car":"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ","har":"إِنَّ رَبَّكُمْ حَيِيٌّ كَرِيمٌ، يَسْتَحْيِي مِنْ عَبْدِهِ إِذَا رَفَعَ يَدَيْهِ إِلَيْهِ أَنْ يَرُدَّهُمَا صِفْرًا"},{"n":45,"translit":"Al-Wâsi'","fr":"L'Immense, Celui dont les dons sont vastes","sens":"Sa science, Sa miséricorde et Sa générosité sont sans limites.","coran":"« Ma miséricorde embrasse toute chose. » — Al-A'râf, 7:156","hadith":"Quand Allah créa la création, Il écrivit auprès de Lui : « Ma miséricorde l'emporte sur Ma colère. » — Al-Bukhârî 7404, Muslim 2751","rappel":"Ne rétrécis pas dans ta tête ce qu'Allah a rendu vaste : Sa miséricorde est plus grande que tes erreurs.","action":"Demande grand dans tes douas : tu t'adresses à Al-Wâsi'.","ar":"الْوَاسِعُ","flag":"","ref":[7,156],"car":"وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ","har":"إِنَّ رَحْمَتِي سَبَقَتْ غَضَبِي"},{"n":46,"translit":"Al-Hakîm","fr":"Le Sage","sens":"Tout ce qu'Il crée, ordonne ou décrète a une sagesse parfaite, même quand elle nous échappe.","coran":"« Gloire à Toi ! Nous n'avons de savoir que ce que Tu nous as appris. C'est Toi l'Omniscient, le Sage. » — Al-Baqara, 2:32","rappel":"Il se peut que vous détestiez une chose alors qu'elle est un bien pour vous (Al-Baqara, 2:216). Fais confiance au Sage.","action":"Face à une contrariété, dis : « Qaddara Llâhu wa mâ shâ'a fa'al » (Allah a décrété, et Il fait ce qu'Il veut).","ar":"الْحَكِيمُ","flag":"","ref":[2,32],"car":"سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنْتَ الْعَلِيمُ الْحَكِيمُ"},{"n":47,"translit":"Al-Wadûd","fr":"Le Bien-Aimant","sens":"Il aime Ses serviteurs pieux et Il est aimé d'eux ; Il fait naître l'amour dans les cœurs.","coran":"« Et c'est Lui le Pardonneur, le Bien-Aimant. » — Al-Burûj, 85:14","hadith":"« Quand Allah aime un serviteur, Il appelle Jibrîl : \"J'aime untel, aime-le.\" Jibrîl l'aime, puis l'annonce aux habitants du ciel, qui l'aiment, puis l'acceptation lui est accordée sur terre. » — Al-Bukhârî 3209, Muslim 2637","rappel":"Allah t'aime avant que tu ne L'aimes. Ton amour pour Lui n'est qu'une réponse.","action":"Dis à quelqu'un que tu l'aimes pour Allah (Abû Dâwûd 5124).","ar":"الْوَدُودُ","flag":"","ref":[85,14],"car":"وَهُوَ الْغَفُورُ الْوَدُودُ","har":"إِذَا أَحَبَّ اللَّهُ الْعَبْدَ نَادَى جِبْرِيلَ: إِنَّ اللَّهَ يُحِبُّ فُلَانًا فَأَحْبِبْهُ، فَيُحِبُّهُ جِبْرِيلُ، فَيُنَادِي جِبْرِيلُ فِي أَهْلِ السَّمَاءِ: إِنَّ اللَّهَ يُحِبُّ فُلَانًا فَأَحِبُّوهُ، فَيُحِبُّهُ أَهْلُ السَّمَاءِ، ثُمَّ يُوضَعُ لَهُ الْقَبُولُ فِي الْأَرْضِ"},{"n":48,"translit":"Al-Majîd","fr":"Le Glorieux","sens":"Sa gloire est immense, Ses qualités sont parfaites et Ses bienfaits abondants.","coran":"« Il est digne de louange et de gloire. » — Hûd, 11:73","hadith":"La prière sur le Prophète ﷺ dans le tashahhud se termine par : « Innaka Hamîdun Majîd. » — Al-Bukhârî 3370","rappel":"Chaque prière se conclut sur ces deux noms : le Digne de louange, le Glorieux.","action":"Multiplie les prières sur le Prophète ﷺ aujourd'hui, surtout si c'est un vendredi.","ar":"الْمَجِيدُ","flag":"","ref":[11,73],"car":"إِنَّهُ حَمِيدٌ مَجِيدٌ","har":"إِنَّكَ حَمِيدٌ مَجِيدٌ"},{"n":49,"translit":"Al-Bâ'ith","fr":"Celui qui ressuscite","sens":"Il ressuscitera les morts et envoie les messagers.","coran":"« Et Allah ressuscitera ceux qui sont dans les tombeaux. » — Al-Hajj, 22:7","hadith":"« Les gens seront rassemblés le Jour de la Résurrection pieds nus, nus et incirconcis. » — Al-Bukhârî 6527, Muslim 2859","rappel":"Ce n'est pas la fin, c'est un passage. Prépare ton réveil.","action":"Visite une tombe ou pense à la mort quelques instants : cela adoucit le cœur.","ar":"الْبَاعِثُ","flag":"","ref":[22,7],"car":"وَأَنَّ اللَّهَ يَبْعَثُ مَنْ فِي الْقُبُورِ","har":"إِنَّكُمْ مَحْشُورُونَ حُفَاةً عُرَاةً غُرْلًا"},{"n":50,"translit":"Ash-Shahîd","fr":"Le Témoin","sens":"Il est témoin de toute chose ; rien ne Lui est caché.","coran":"« Et Allah suffit comme témoin. » — An-Nisâ', 4:79","rappel":"Même si personne ne croit ta vérité, Allah en est témoin. Cela suffit.","action":"Dis la vérité aujourd'hui, même si elle te coûte.","ar":"الشَّهِيدُ","flag":"","ref":[4,79],"car":"وَكَفَىٰ بِاللَّهِ شَهِيدًا"},{"n":51,"translit":"Al-Haqq","fr":"La Vérité","sens":"Il est la Vérité absolue ; Son existence, Ses paroles et Ses promesses sont vraies.","coran":"« Il en est ainsi parce qu'Allah est la Vérité, et c'est Lui qui rend la vie aux morts. » — Al-Hajj, 22:6","hadith":"Dans sa prière de la nuit, le Prophète ﷺ disait : « Tu es la Vérité, Ta promesse est vérité, Ta rencontre est vérité, le Paradis est vérité, l'Enfer est vérité. » — Al-Bukhârî 1120, Muslim 769","rappel":"Tout ce qui n'est pas pour Allah finit par disparaître ; seul le vrai demeure.","action":"Apprends cette doua de la nuit et récite-la avant la prière nocturne.","ar":"الْحَقُّ","flag":"","ref":[22,6],"car":"ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّهُ يُحْيِي الْمَوْتَىٰ","har":"أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَلِقَاؤُكَ حَقٌّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ"},{"n":52,"translit":"Al-Wakîl","fr":"Le Garant, Celui à qui l'on se confie","sens":"Il prend en charge les affaires de celui qui s'en remet à Lui ; Il est le meilleur protecteur.","coran":"« Allah nous suffit, et quel excellent Garant ! » — Âl 'Imrân, 3:173","hadith":"Ibn 'Abbâs rapporte qu'Ibrâhîm prononça « Hasbuna Llâhu wa ni'ma l-Wakîl » quand il fut jeté dans le feu, et Muhammad ﷺ la prononça quand on lui dit que l'ennemi s'était rassemblé contre lui. — Al-Bukhârî 4563","rappel":"Le feu est devenu fraîcheur pour Ibrâhîm. Confie ton problème au même Wakîl.","action":"Dans une difficulté, répète ce verset (At-Tawba, 9:129) : « Hasbiya Llâhu lâ ilâha illâ huwa, 'alayhi tawakkaltu. »","ar":"الْوَكِيلُ","flag":"","ref":[3,173],"car":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","har":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ"},{"n":53,"translit":"Al-Qawiyy","fr":"Le Fort","sens":"Sa force est parfaite, rien ne L'épuise ni ne Lui résiste.","coran":"« Allah est certes Fort et Puissant. » — Al-Hajj, 22:40","hadith":"« Le croyant fort est meilleur et plus aimé d'Allah que le croyant faible, et en chacun il y a du bien. » — Muslim 2664","rappel":"« Lâ hawla wa lâ quwwata illâ billâh » est un trésor du Paradis (Al-Bukhârî 4205, Muslim 2704) : toute force vient de Lui.","action":"Répète « Lâ hawla wa lâ quwwata illâ billâh » avant une tâche difficile.","ar":"الْقَوِيُّ","flag":"","ref":[22,40],"car":"إِنَّ اللَّهَ لَقَوِيٌّ عَزِيزٌ","har":"الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ"},{"n":54,"translit":"Al-Matîn","fr":"L'Inébranlable","sens":"Sa force est ferme et constante : elle ne faiblit jamais.","coran":"« Allah est le Grand Pourvoyeur, le Détenteur de la force, l'Inébranlable. » — Adh-Dhâriyât, 51:58","rappel":"Accroche-toi à la corde d'Allah : elle ne casse jamais.","action":"Choisis une bonne action et fais-la chaque jour cette semaine, même petite : Allah aime la constance.","ar":"الْمَتِينُ","flag":"","ref":[51,58],"car":"إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ"},{"n":55,"translit":"Al-Waliyy","fr":"L'Allié, le Protecteur","sens":"Il est l'allié des croyants : Il les soutient, les guide et les fait sortir des ténèbres vers la lumière.","coran":"« Allah est l'allié de ceux qui ont la foi : Il les fait sortir des ténèbres vers la lumière. » — Al-Baqara, 2:257","hadith":"Allah dit : « Quiconque est hostile à un de Mes alliés, Je lui déclare la guerre. » — Al-Bukhârî 6502","rappel":"Celui qui a Allah pour allié, qui peut-il craindre ?","action":"Ajoute une prière surérogatoire aujourd'hui : c'est par elles que le serviteur se rapproche d'Allah jusqu'à être aimé (même hadith).","ar":"الْوَلِيُّ","flag":"","ref":[2,257],"car":"اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا يُخْرِجُهُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ","har":"مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالْحَرْبِ"},{"n":56,"translit":"Al-Hamîd","fr":"Le Digne de louange","sens":"Il est loué pour Ses qualités et Ses actes, en toute circonstance.","coran":"« Ô hommes, vous êtes les pauvres ayant besoin d'Allah, et c'est Allah qui se suffit à Lui-même, le Digne de louange. » — Fâtir, 35:15","hadith":"« Al-hamdu lillâh remplit la balance. » — Muslim 223","rappel":"Dire « Alhamdulillah » dans l'épreuve, c'est le sommet de la foi.","action":"Note trois bienfaits de ta journée et dis « Alhamdulillah » pour chacun.","ar":"الْحَمِيدُ","flag":"","ref":[35,15],"car":"يَا أَيُّهَا النَّاسُ أَنْتُمُ الْفُقَرَاءُ إِلَى اللَّهِ ۖ وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ","har":"وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ"},{"n":57,"translit":"Al-Muhsî","fr":"Celui qui dénombre tout","sens":"Il compte et connaît le nombre exact de toute chose : gouttes de pluie, feuilles, souffles, actes. Nom de la liste traditionnelle, tiré du verbe employé dans le Coran.","coran":"« Il a dénombré toute chose avec précision. » — Al-Jinn, 72:28","rappel":"Aucune de tes bonnes actions n'est oubliée, même celles que toi-même as oubliées.","action":"Compte tes dhikr sur les doigts de la main droite : ils témoigneront pour toi.","ar":"الْمُحْصِي","flag":"trad","ref":[72,28],"car":"وَأَحْصَىٰ كُلَّ شَيْءٍ عَدَدًا"},{"n":58,"translit":"Al-Mubdi'","fr":"Celui qui crée une première fois","sens":"Il donne naissance à la création sans modèle préalable.","coran":"« C'est Lui qui commence la création puis la refait, et cela Lui est encore plus facile. » — Ar-Rûm, 30:27","rappel":"Celui qui t'a créé une première fois peut recommencer ta vie à zéro par le repentir.","action":"Commence aujourd'hui un nouveau bon projet, avec Bismillah.","ar":"الْمُبْدِئُ","flag":"","ref":[30,27],"car":"وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ"},{"n":59,"translit":"Al-Mu'îd","fr":"Celui qui fait revenir à la vie","sens":"Il ramènera les créatures à la vie après la mort, comme Il les a créées.","coran":"« C'est Lui qui commence et qui recommence. » — Al-Burûj, 85:13","rappel":"Recréer est plus facile que créer : la résurrection est une certitude.","action":"Reviens à une bonne habitude que tu avais abandonnée.","ar":"الْمُعِيدُ","flag":"","ref":[85,13],"car":"إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ"},{"n":60,"translit":"Al-Muhyî","fr":"Celui qui donne la vie","sens":"Il donne la vie aux corps, à la terre morte et aux cœurs endurcis.","coran":"« Regarde donc les effets de la miséricorde d'Allah, comment Il redonne la vie à la terre après sa mort. » — Ar-Rûm, 30:50","hadith":"Au réveil, le Prophète ﷺ disait : « Louange à Allah qui nous a rendu la vie après nous avoir fait mourir, et c'est vers Lui la résurrection. » — Al-Bukhârî 6312","rappel":"Chaque réveil est une petite résurrection, une nouvelle chance.","action":"Dis cette doua demain matin, dès que tu ouvres les yeux.","ar":"الْمُحْيِي","flag":"","ref":[30,50],"car":"فَانْظُرْ إِلَىٰ آثَارِ رَحْمَتِ اللَّهِ كَيْفَ يُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا","har":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ"},{"n":61,"translit":"Al-Mumît","fr":"Celui qui donne la mort","sens":"Il fixe le terme de chaque vie ; personne ne meurt sans Sa permission, ni avant ni après l'heure.","coran":"« Celui qui a créé la mort et la vie afin de vous éprouver : lequel de vous est le meilleur en œuvres. » — Al-Mulk, 67:2","rappel":"La mort n'est pas le contraire de la vie : c'est le passage vers la vraie vie. La question n'est pas « quand ? » mais « comment ? ».","action":"Récite la sourate Al-Mulk ce soir avant de dormir.","ar":"الْمُمِيتُ","flag":"","ref":[67,2],"car":"الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا"},{"n":62,"translit":"Al-Hayy","fr":"Le Vivant","sens":"Sa vie est parfaite, sans commencement ni fin, sans sommeil ni fatigue.","coran":"« Allah ! Point de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même. Ni somnolence ni sommeil ne Le saisissent. » — Al-Baqara, 2:255","rappel":"Place ta confiance dans le Vivant qui ne meurt pas (Al-Furqân, 25:58), pas dans des créatures qui passeront.","action":"Récite l'Âyat al-Kursî après chaque prière obligatoire.","ar":"الْحَيُّ","flag":"","ref":[2,255],"car":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ"},{"n":63,"translit":"Al-Qayyûm","fr":"Celui qui subsiste par Lui-même et fait subsister tout","sens":"Il n'a besoin de rien, et toute chose a besoin de Lui pour exister à chaque instant.","coran":"« Allah ! Point de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même. » — Âl 'Imrân, 3:2","hadith":"Quand une affaire l'angoissait, le Prophète ﷺ disait : « Yâ Hayyu yâ Qayyûm, bi-rahmatika astaghîth » (Ô Vivant, ô Subsistant, j'implore le secours de Ta miséricorde). — at-Tirmidhî 3524 (hasan)","rappel":"Beaucoup de savants voient dans « Al-Hayy Al-Qayyûm » le Nom suprême par lequel une doua est exaucée.","action":"Dans un moment difficile, invoque « Yâ Hayyu yâ Qayyûm ».","ar":"الْقَيُّومُ","flag":"","ref":[3,2],"car":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ","har":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ"},{"n":64,"translit":"Al-Wâjid","fr":"Celui qui trouve tout, qui ne manque de rien","sens":"Rien ne Lui échappe ni ne Lui manque ; Il obtient tout ce qu'Il veut. Nom de la liste traditionnelle, discuté par les savants.","coran":"« C'est à Allah qu'appartient ce qui est dans les cieux et sur la terre. » — Al-Baqara, 2:284","rappel":"Quand tu as Allah, que te manque-t-il ? Et quand tu Le perds, qu'as-tu vraiment ?","action":"Dis « Alhamdulillah » pour une chose que tu possèdes et que tu prends pour acquise.","ar":"الْوَاجِدُ","flag":"disc","ref":[2,284],"car":"لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ"},{"n":65,"translit":"Al-Mâjid","fr":"Le Noble, l'Illustre","sens":"Proche d'Al-Majîd (n° 48) : Il est parfait dans Sa noblesse et généreux dans Ses dons.","coran":"« Le Maître du Trône, le Glorieux. » — Al-Burûj, 85:15","rappel":"La noblesse du croyant vient de sa proximité avec le Noble, pas de son nom ou de sa richesse.","action":"Agis noblement aujourd'hui : pardonne à quelqu'un sans le lui faire remarquer.","ar":"الْمَاجِدُ","flag":"","ref":[85,15],"car":"ذُو الْعَرْشِ الْمَجِيدُ"},{"n":66,"translit":"Al-Wâhid","fr":"L'Unique","sens":"Il est Un dans Son essence, Ses noms et Ses actes ; Il n'a ni associé ni égal.","coran":"« Dis : Allah est le Créateur de toute chose, et c'est Lui l'Unique, le Dominateur. » — Ar-Ra'd, 13:16","rappel":"Un seul Dieu, donc un seul regard à satisfaire : cela libère le cœur.","action":"Dis 100 fois : « Lâ ilâha illa Llâhu wahdahu lâ sharîka lah… » (Al-Bukhârî 3293, Muslim 2691).","ar":"الْوَاحِدُ","flag":"","ref":[13,16],"car":"قُلِ اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ الْوَاحِدُ الْقَهَّارُ"},{"n":67,"translit":"Al-Ahad","fr":"L'Un, l'Unique en tout","sens":"Il est absolument Un, sans division ni semblable.","coran":"« Dis : Il est Allah, Unique. » — Al-Ikhlâs, 112:1","hadith":"« Qul huwa Llâhu Ahad équivaut à un tiers du Coran. » — Al-Bukhârî 5013. Un compagnon aimait tant cette sourate que le Prophète ﷺ lui dit : « Ton amour pour elle te fera entrer au Paradis. » — Al-Bukhârî (mu'allaq), at-Tirmidhî 2901","rappel":"Bilâl, torturé sous une pierre brûlante, ne répondait que : « Ahad, Ahad. »","action":"Récite Al-Ikhlâs 3 fois : c'est comme si tu avais lu tout le Coran.","ar":"الْأَحَدُ","flag":"","ref":[112,1],"car":"قُلْ هُوَ اللَّهُ أَحَدٌ","har":"قُلْ هُوَ اللَّهُ أَحَدٌ تَعْدِلُ ثُلُثَ الْقُرْآنِ · حُبُّكَ إِيَّاهَا أَدْخَلَكَ الْجَنَّةَ"},{"n":68,"translit":"As-Samad","fr":"Le Seul à être imploré, l'Absolu","sens":"Tous ont besoin de Lui et Lui n'a besoin de personne ; c'est vers Lui que l'on se tourne pour tout.","coran":"« Allah, le Seul à être imploré pour ce que nous désirons. » — Al-Ikhlâs, 112:2","rappel":"Avant de chercher qui pourrait t'aider, demande d'abord à As-Samad.","action":"Pour ton prochain besoin, fais d'abord une doua avant d'en parler à quiconque.","ar":"الصَّمَدُ","flag":"","ref":[112,2],"car":"اللَّهُ الصَّمَدُ"},{"n":69,"translit":"Al-Qâdir","fr":"Le Capable","sens":"Rien ne Lui est impossible ; Il fait ce qu'Il veut quand Il le veut.","coran":"« Allah est capable de toute chose. » — Al-Baqara, 2:20","hadith":"Dans l'istikhâra : « Tu es capable et je ne le suis pas. » — Al-Bukhârî 1166","rappel":"Ce qui te semble impossible est facile pour Al-Qâdir : Maryam a eu un enfant sans homme, Zakariyyâ dans sa vieillesse.","action":"Demande à Allah quelque chose qui te paraît impossible.","ar":"الْقَادِرُ","flag":"","ref":[2,20],"car":"إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","har":"فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ"},{"n":70,"translit":"Al-Muqtadir","fr":"Le Tout-Puissant qui détermine tout","sens":"Sa puissance est totale et s'exerce sur toute chose, dans les moindres détails.","coran":"« Les pieux seront dans des jardins et des rivières, dans un séjour de vérité, auprès d'un Roi tout-puissant. » — Al-Qamar, 54:54-55","rappel":"Le but ultime : être « auprès du Roi tout-puissant ». Chaque bonne action t'en rapproche.","action":"Fais une invocation pour le Paradis : « Allahumma innî as'aluka l-Firdaws. »","ar":"الْمُقْتَدِرُ","flag":"","ref":[54,54],"car":"إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَنَهَرٍ ۝ فِي مَقْعَدِ صِدْقٍ عِنْدَ مَلِيكٍ مُقْتَدِرٍ"},{"n":71,"translit":"Al-Muqaddim","fr":"Celui qui fait avancer","sens":"Il fait avancer qui Il veut, dans le temps, le rang ou la proximité, selon Sa sagesse. Il va avec Al-Mu'akhkhir.","hadith":"Le Prophète ﷺ terminait une de ses douas par : « Anta l-Muqaddimu wa anta l-Mu'akhkhir, wa anta 'alâ kulli shay'in qadîr » (C'est Toi qui avances et Toi qui retardes, et Tu es capable de toute chose). — Al-Bukhârî 6398, Muslim 2719","rappel":"Ne te compare pas : chacun avance au rythme qu'Allah a voulu pour lui.","action":"Fais passer Allah en premier aujourd'hui : prie dès l'appel, avant tout le reste.","ar":"الْمُقَدِّمُ","flag":"","har":"أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، وَأَنْتَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"},{"n":72,"translit":"Al-Mu'akhkhir","fr":"Celui qui retarde","sens":"Il retarde ce qu'Il veut, par sagesse : une réponse, une punition, une épreuve ou un bien.","coran":"« Si Allah s'en prenait aux gens pour leurs méfaits, Il ne laisserait sur terre aucun être vivant ; mais Il les renvoie jusqu'à un terme fixé. » — An-Nahl, 16:61","rappel":"Un retard d'Allah n'est jamais un refus : c'est un rendez-vous fixé au meilleur moment.","action":"Continue une doua que tu as presque abandonnée parce qu'elle « ne marchait pas ».","ar":"الْمُؤَخِّرُ","flag":"","ref":[16,61],"car":"وَلَوْ يُؤَاخِذُ اللَّهُ النَّاسَ بِظُلْمِهِمْ مَا تَرَكَ عَلَيْهَا مِنْ دَابَّةٍ وَلَٰكِنْ يُؤَخِّرُهُمْ إِلَىٰ أَجَلٍ مُسَمًّى"},{"n":73,"translit":"Al-Awwal","fr":"Le Premier","sens":"Il existe avant toute chose, sans commencement.","coran":"« C'est Lui le Premier et le Dernier, l'Apparent et le Caché, et Il connaît toute chose. » — Al-Hadîd, 57:3","hadith":"Avant de dormir : « Ô Allah, Tu es le Premier, rien n'est avant Toi ; Tu es le Dernier, rien n'est après Toi ; Tu es l'Apparent, rien n'est au-dessus de Toi ; Tu es le Caché, rien n'est en deçà de Toi. Acquitte nos dettes et enrichis-nous contre la pauvreté. » — Muslim 2713","rappel":"Avant ton existence, Allah prenait déjà soin de toi.","action":"Apprends cette doua (Muslim 2713) et dis-la ce soir au coucher.","ar":"الْأَوَّلُ","flag":"","ref":[57,3],"car":"هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ ۖ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ","har":"اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ، وَأَغْنِنَا مِنَ الْفَقْرِ"},{"n":74,"translit":"Al-Âkhir","fr":"Le Dernier","sens":"Il demeure après toute chose, sans fin.","coran":"« Tout ce qui est sur elle (la terre) doit disparaître. » — Ar-Rahmân, 55:26","rappel":"Investis dans ce qui reste : tout le reste s'efface.","action":"Fais une aumône continue (sadaqa jâriya) : un puits, un Coran, un savoir transmis.","ar":"الْآخِرُ","flag":"","ref":[55,26],"car":"كُلُّ مَنْ عَلَيْهَا فَانٍ"},{"n":75,"translit":"Az-Zâhir","fr":"L'Apparent","sens":"Il est au-dessus de toute chose ; Ses signes sont manifestes partout dans la création.","coran":"« Nous leur montrerons Nos signes dans l'univers et en eux-mêmes, jusqu'à ce qu'il leur devienne évident que c'est la vérité. » — Fussilat, 41:53","rappel":"Chaque lever de soleil, chaque battement de cœur est un signe qui pointe vers Lui.","action":"Prends le temps de contempler un coucher ou un lever de soleil en disant « Subhânallah ».","ar":"الظَّاهِرُ","flag":"","ref":[41,53],"car":"سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنْفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ"},{"n":76,"translit":"Al-Bâtin","fr":"Le Caché","sens":"Son essence est cachée aux regards, et Il connaît le plus intime de chaque chose ; rien ne Lui échappe.","coran":"« Les regards ne peuvent L'atteindre, mais Lui atteint tous les regards. » — Al-An'âm, 6:103","rappel":"Allah est plus proche de toi que ta veine jugulaire (Qâf, 50:16).","action":"Soigne aujourd'hui ton intérieur autant que ton apparence : une pensée, une intention.","ar":"الْبَاطِنُ","flag":"","ref":[6,103],"car":"لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ"},{"n":77,"translit":"Al-Wâlî","fr":"Le Gouverneur, le Maître","sens":"Il gère et dirige toutes les affaires de la création.","coran":"« Et ils n'ont, en dehors de Lui, aucun protecteur. » — Ar-Ra'd, 13:11","rappel":"Celui qui dirige les galaxies n'est pas dépassé par ta situation.","action":"Confie à Allah une affaire qui t'échappe et cesse de la ruminer.","ar":"الْوَالِي","flag":"","ref":[13,11],"car":"وَمَا لَهُمْ مِنْ دُونِهِ مِنْ وَالٍ"},{"n":78,"translit":"Al-Muta'âlî","fr":"Le Sublime, le Transcendant","sens":"Il est infiniment au-dessus de tout défaut et de toute comparaison.","coran":"« Le Connaisseur de l'invisible et du visible, le Grand, le Sublime. » — Ar-Ra'd, 13:9","rappel":"Tout ce que ton imagination peut se représenter, Allah est au-delà.","action":"Médite sur Al-Ikhlâs, 112:4 : « Nul n'est égal à Lui. »","ar":"الْمُتَعَالِي","flag":"","ref":[13,9],"car":"عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرُ الْمُتَعَالِ"},{"n":79,"translit":"Al-Barr","fr":"Le Bienfaisant","sens":"Sa bonté et Ses bienfaits sont immenses ; Il est doux et fidèle à Ses promesses.","coran":"« C'est Lui le Bienfaisant, le Miséricordieux. » — At-Tûr, 52:28","rappel":"La bonté envers les parents (birr al-wâlidayn) vient de la même racine : sois barr comme ton Seigneur aime que tu le sois.","action":"Appelle ou aide un de tes parents aujourd'hui, ou fais une doua pour eux.","ar":"الْبَرُّ","flag":"","ref":[52,28],"car":"إِنَّهُ هُوَ الْبَرُّ الرَّحِيمُ"},{"n":80,"translit":"At-Tawwâb","fr":"Celui qui accepte sans cesse le repentir","sens":"Il guide vers le repentir, puis l'accepte, encore et encore.","coran":"« Adam reçut de son Seigneur des paroles, et Allah accepta son repentir. C'est Lui l'Accueillant au repentir, le Miséricordieux. » — Al-Baqara, 2:37","hadith":"« Allah se réjouit davantage du repentir de Son serviteur qu'un homme qui, ayant perdu sa monture dans le désert avec ses provisions, la retrouve soudain. » — Al-Bukhârî 6309, Muslim 2747","rappel":"Allah ne se lasse pas de pardonner tant que tu ne te lasses pas de revenir.","action":"Fais aujourd'hui une tawba sincère : regret, arrêt, et résolution de ne plus recommencer.","ar":"التَّوَّابُ","flag":"","ref":[2,37],"car":"فَتَلَقَّىٰ آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ ۚ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ","har":"لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ مِنْ أَحَدِكُمْ سَقَطَ عَلَى بَعِيرِهِ وَقَدْ أَضَلَّهُ فِي أَرْضِ فَلَاةٍ"},{"n":81,"translit":"Al-Muntaqim","fr":"Celui qui châtie les criminels","sens":"Il punit avec justice ceux qui persistent dans l'injustice après avoir été avertis. Dans le Coran, on trouve « Dhû ntiqâm » (Détenteur du châtiment) ; les savants préfèrent le mentionner ainsi plutôt que seul.","coran":"« Allah est Puissant et Détenteur du châtiment. » — Âl 'Imrân, 3:4","rappel":"Personne n'échappe à la justice d'Allah : cela console l'opprimé et avertit l'oppresseur.","action":"Méfie-toi de l'invocation de l'opprimé : il n'y a pas de voile entre elle et Allah (Al-Bukhârî 1496). Ne lèse personne aujourd'hui.","ar":"الْمُنْتَقِمُ","flag":"disc","ref":[3,4],"car":"وَاللَّهُ عَزِيزٌ ذُو انْتِقَامٍ"},{"n":82,"translit":"Al-'Afuww","fr":"Celui qui efface les péchés","sens":"Plus que pardonner, Il efface complètement le péché, comme s'il n'avait jamais existé.","coran":"« Allah est Celui qui efface, le Pardonneur. » — An-Nisâ', 4:99","hadith":"'Â'isha demanda quoi dire si elle trouvait Laylat al-Qadr. Le Prophète ﷺ répondit : « Allahumma innaka 'Afuwwun tuhibbu l-'afwa fa'fu 'annî » (Ô Allah, Tu es Celui qui efface, Tu aimes effacer, alors efface mes fautes). — at-Tirmidhî 3513 (authentique)","rappel":"Allah aime effacer. Ne Le prive pas de ce qu'Il aime : reviens à Lui.","action":"Apprends cette doua par cœur et efface toi aussi la faute de quelqu'un.","ar":"الْعَفُوُّ","flag":"","ref":[4,99],"car":"وَكَانَ اللَّهُ عَفُوًّا غَفُورًا","har":"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي"},{"n":83,"translit":"Ar-Ra'ûf","fr":"Le Très-Bienveillant, le Compatissant","sens":"Sa tendresse est la forme la plus douce de la miséricorde : Il épargne à Ses serviteurs ce qui est trop lourd.","coran":"« Allah est, envers les gens, Compatissant et Miséricordieux. » — Al-Baqara, 2:143","rappel":"Allah n'impose à aucune âme plus que ce qu'elle peut porter (Al-Baqara, 2:286) : ton épreuve est à ta mesure.","action":"Allège la charge de quelqu'un aujourd'hui : une tâche, une dette, un souci.","ar":"الرَّءُوفُ","flag":"","ref":[2,143],"car":"إِنَّ اللَّهَ بِالنَّاسِ لَرَءُوفٌ رَحِيمٌ"},{"n":84,"translit":"Mâlik al-Mulk","fr":"Le Possesseur de la royauté","sens":"Toute royauté Lui appartient ; Il la donne et la reprend à qui Il veut.","coran":"« Dis : Ô Allah, Possesseur de la royauté, Tu donnes la royauté à qui Tu veux et Tu l'arraches à qui Tu veux. » — Âl 'Imrân, 3:26","rappel":"Ce que tu possèdes est un prêt : utilise-le comme le voudrait son vrai Propriétaire.","action":"Récite Âl 'Imrân 3:26-27 et médite sur ce qu'Allah t'a confié.","ar":"مَالِكُ الْمُلْكِ","flag":"","ref":[3,26],"car":"قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ"},{"n":85,"translit":"Dhû l-Jalâli wa l-Ikrâm","fr":"Le Détenteur de la Majesté et de la Générosité","sens":"Il réunit la majesté qui inspire le respect et la générosité qui attire l'amour.","coran":"« Béni soit le nom de ton Seigneur, plein de majesté et de générosité. » — Ar-Rahmân, 55:78","hadith":"« Attachez-vous à \"Yâ Dhâ l-Jalâli wa l-Ikrâm\" (répétez-le souvent). » — at-Tirmidhî 3525 (authentique)","rappel":"Craindre et aimer en même temps : c'est l'équilibre du croyant devant ce nom.","action":"Commence et termine tes douas aujourd'hui par « Yâ Dhâ l-Jalâli wa l-Ikrâm ».","ar":"ذُو الْجَلَالِ وَالْإِكْرَامِ","flag":"","ref":[55,78],"car":"تَبَارَكَ اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ","har":"أَلِظُّوا بِيَا ذَا الْجَلَالِ وَالْإِكْرَامِ"},{"n":86,"translit":"Al-Muqsit","fr":"L'Équitable","sens":"Il établit la justice parfaite et rend à chacun son droit.","coran":"« Allah atteste qu'il n'y a de divinité que Lui, et Il maintient la justice. » — Âl 'Imrân, 3:18","hadith":"« Les équitables seront auprès d'Allah sur des chaires de lumière : ceux qui sont justes dans leurs jugements, avec leurs familles et dans ce dont ils ont la charge. » — Muslim 1827","rappel":"La justice commence à la maison : entre tes enfants, ton conjoint, tes proches.","action":"Vérifie si tu es équitable avec tes proches dans ton temps et ton attention.","ar":"الْمُقْسِطُ","flag":"","ref":[3,18],"car":"شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ … قَائِمًا بِالْقِسْطِ","har":"إِنَّ الْمُقْسِطِينَ عِنْدَ اللَّهِ عَلَى مَنَابِرَ مِنْ نُورٍ … الَّذِينَ يَعْدِلُونَ فِي حُكْمِهِمْ وَأَهْلِيهِمْ وَمَا وَلُوا"},{"n":87,"translit":"Al-Jâmi'","fr":"Celui qui rassemble","sens":"Il rassemblera toutes les créatures au Jour dernier, et Il réunit les cœurs et les choses dispersées.","coran":"« Seigneur, c'est Toi qui rassembleras les gens, un jour au sujet duquel il n'y a aucun doute. » — Âl 'Imrân, 3:9","rappel":"Celui qui a réuni Yûsuf et Ya'qûb après des années peut réunir ce qui est séparé dans ta vie.","action":"Réconcilie deux personnes, ou renoue un lien de famille rompu.","ar":"الْجَامِعُ","flag":"","ref":[3,9],"car":"رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ"},{"n":88,"translit":"Al-Ghanî","fr":"Le Riche, Celui qui se suffit à Lui-même","sens":"Il n'a besoin de personne ; c'est nous qui avons besoin de Lui.","coran":"« Ô hommes, vous êtes les pauvres ayant besoin d'Allah, et c'est Allah qui se suffit à Lui-même. » — Fâtir, 35:15","hadith":"Allah dit : « Ô Mes serviteurs, si le premier et le dernier d'entre vous, hommes et djinns, avaient le cœur du plus pieux d'entre vous, cela n'ajouterait rien à Mon royaume. » — Muslim 2577","rappel":"Ton adoration ne profite qu'à toi. Allah n'en a pas besoin ; c'est un cadeau qu'Il te fait.","action":"Prie aujourd'hui avec l'état d'esprit d'un pauvre qui frappe à la porte du Riche.","ar":"الْغَنِيُّ","flag":"","ref":[35,15],"car":"يَا أَيُّهَا النَّاسُ أَنْتُمُ الْفُقَرَاءُ إِلَى اللَّهِ ۖ وَاللَّهُ هُوَ الْغَنِيُّ","har":"يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَٰلِكَ فِي مُلْكِي شَيْئًا"},{"n":89,"translit":"Al-Mughnî","fr":"Celui qui enrichit","sens":"Il enrichit qui Il veut, matériellement et surtout dans le cœur.","coran":"« Et c'est Lui qui enrichit et qui fait acquérir. » — An-Najm, 53:48","hadith":"« La richesse n'est pas l'abondance des biens, mais la richesse de l'âme. » — Al-Bukhârî 6446, Muslim 1051","rappel":"Le plus riche n'est pas celui qui a le plus, mais celui qui a le moins besoin.","action":"Demande : « Allahumma kfinî bi-halâlika 'an harâmik, wa aghninî bi-fadlika 'amman siwâk » (Suffis-moi par le licite pour que je me passe de l'illicite, et enrichis-moi par Ta grâce pour que je n'aie besoin que de Toi). — at-Tirmidhî 3563 (hasan)","ar":"الْمُغْنِي","flag":"","ref":[53,48],"car":"وَأَنَّهُ هُوَ أَغْنَىٰ وَأَقْنَىٰ","har":"لَيْسَ الْغِنَى عَنْ كَثْرَةِ الْعَرَضِ، وَلَٰكِنَّ الْغِنَى غِنَى النَّفْسِ"},{"n":90,"translit":"Al-Mâni'","fr":"Celui qui empêche, qui protège","sens":"Il retient ce qu'Il veut, par sagesse, et protège Ses serviteurs de ce qui leur nuirait. Nom de la liste traditionnelle.","hadith":"Après la prière, le Prophète ﷺ disait : « Ô Allah, nul ne peut retenir ce que Tu donnes, ni donner ce que Tu retiens. » — Al-Bukhârî 844, Muslim 593","rappel":"Parfois Allah te refuse quelque chose pour te protéger de ce que tu ne vois pas.","action":"Ajoute cette invocation après tes prières obligatoires.","ar":"الْمَانِعُ","flag":"trad","har":"اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ"},{"n":91,"translit":"Ad-Dârr","fr":"Celui qui peut nuire (par sagesse)","sens":"Rien ne peut atteindre une créature sans Sa permission, même un mal. Nom de la liste traditionnelle : les savants insistent pour ne jamais le dire seul, mais avec An-Nâfi'.","coran":"« Si Allah fait qu'un mal te touche, nul ne peut l'écarter en dehors de Lui. » — Al-An'âm, 6:17","rappel":"Ce qui t'arrive n'aurait pas pu te manquer, et ce qui t'a manqué n'aurait pas pu t'arriver.","action":"Face à un mal, tourne-toi vers Allah avant de chercher un coupable.","ar":"الضَّارُّ","flag":"disc","ref":[6,17],"car":"وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ"},{"n":92,"translit":"An-Nâfi'","fr":"Celui qui accorde le bienfait","sens":"Tout bien qui arrive vient de Lui ; aucune créature ne peut être utile sans Sa volonté.","coran":"« Et s'Il te veut un bien, nul ne peut repousser Sa grâce. » — Yûnus, 10:107","hadith":"« Sache que si toute la communauté se réunissait pour te faire un bien, elle ne pourrait te faire que ce qu'Allah a déjà écrit pour toi ; et si elle se réunissait pour te nuire, elle ne pourrait te nuire que par ce qu'Allah a écrit contre toi. » — at-Tirmidhî 2516 (authentique)","rappel":"Libère-toi de la peur des gens et de l'attente envers eux : seul Allah peut vraiment nuire ou être utile.","action":"Demande à Allah une science utile : « Allahumma innî as'aluka 'ilman nâfi'â » (Ibn Mâja 925).","ar":"النَّافِعُ","flag":"","ref":[10,107],"car":"وَإِنْ يُرِدْكَ بِخَيْرٍ فَلَا رَادَّ لِفَضْلِهِ","har":"وَاعْلَمْ أَنَّ الْأُمَّةَ لَوِ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوكَ بِشَيْءٍ لَمْ يَنْفَعُوكَ إِلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ لَكَ، وَلَوِ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوكَ بِشَيْءٍ لَمْ يَضُرُّوكَ إِلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْكَ"},{"n":93,"translit":"An-Nûr","fr":"La Lumière","sens":"Il est la Lumière des cieux et de la terre ; Il illumine les cœurs par la foi et le chemin par la guidance.","coran":"« Allah est la Lumière des cieux et de la terre. Lumière sur lumière. Allah guide vers Sa lumière qui Il veut. » — An-Nûr, 24:35","hadith":"Le Prophète ﷺ invoquait : « Ô Allah, mets une lumière dans mon cœur, une lumière dans ma vue, une lumière dans mon ouïe… et fais de moi une lumière. » — Al-Bukhârî 6316, Muslim 763","rappel":"Le péché assombrit le cœur, la prière et le Coran l'illuminent.","action":"Récite la sourate Al-Kahf vendredi : une lumière entre les deux vendredis (al-Hâkim, jugé authentique par al-Albânî).","ar":"النُّورُ","flag":"","ref":[24,35],"car":"اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ … نُورٌ عَلَىٰ نُورٍ ۗ يَهْدِي اللَّهُ لِنُورِهِ مَنْ يَشَاءُ","har":"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي بَصَرِي نُورًا، وَفِي سَمْعِي نُورًا … وَاجْعَلْنِي نُورًا"},{"n":94,"translit":"Al-Hâdî","fr":"Le Guide","sens":"Il guide les créatures vers ce qui leur est utile, et les croyants vers le droit chemin.","coran":"« Ton Seigneur suffit comme guide et comme secoureur. » — Al-Furqân, 25:31","hadith":"Allah dit : « Ô Mes serviteurs, vous êtes tous égarés sauf celui que Je guide. Demandez-Moi donc la guidance, Je vous guiderai. » — Muslim 2577","rappel":"17 fois par jour au minimum, tu dis « Ihdinâ s-sirâta l-mustaqîm ». La guidance se demande chaque jour.","action":"Récite Al-Fâtiha lentement aujourd'hui, en ressentant que tu demandes vraiment la guidance.","ar":"الْهَادِي","flag":"","ref":[25,31],"car":"وَكَفَىٰ بِرَبِّكَ هَادِيًا وَنَصِيرًا","har":"يَا عِبَادِي كُلُّكُمْ ضَالٌّ إِلَّا مَنْ هَدَيْتُهُ، فَاسْتَهْدُونِي أَهْدِكُمْ"},{"n":95,"translit":"Al-Badî'","fr":"Le Créateur sans modèle, l'Inventeur","sens":"Il a créé les cieux et la terre de manière originale, sans exemple préalable, d'une beauté parfaite.","coran":"« Créateur des cieux et de la terre ! Lorsqu'Il décide une chose, Il lui dit seulement : \"Sois\", et elle est. » — Al-Baqara, 2:117","rappel":"Les flocons de neige, les galaxies, les ailes de papillon : aucune répétition, une créativité sans limite.","action":"Observe une fleur, une feuille ou un insecte de près, et dis : « Subhâna l-Badî'. »","ar":"الْبَدِيعُ","flag":"","ref":[2,117],"car":"بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ ۖ وَإِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُنْ فَيَكُونُ"},{"n":96,"translit":"Al-Bâqî","fr":"Celui qui demeure","sens":"Il est éternel ; tout disparaît sauf Lui.","coran":"« Tout ce qui est sur la terre doit disparaître. Seule subsistera la Face de ton Seigneur. » — Ar-Rahmân, 55:26-27","rappel":"Attache ton cœur à Celui qui reste, pas à ce qui passe.","action":"Choisis une chose de ce monde qui occupe trop ton cœur, et diminue-la cette semaine.","ar":"الْبَاقِي","flag":"","ref":[55,26],"car":"كُلُّ مَنْ عَلَيْهَا فَانٍ ۝ وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ"},{"n":97,"translit":"Al-Wârith","fr":"L'Héritier","sens":"Après la disparition de toutes les créatures, tout Lui reviendra.","coran":"« C'est Nous qui hériterons de la terre et de ceux qui s'y trouvent, et c'est vers Nous qu'ils seront ramenés. » — Maryam, 19:40","rappel":"Zakariyyâ, sans enfant, invoqua : « Seigneur, ne me laisse pas seul, Tu es le meilleur des héritiers » (Al-Anbiyâ', 21:89). Et Allah lui donna Yahyâ.","action":"Récite la doua de Zakariyyâ pour ce qui te manque.","ar":"الْوَارِثُ","flag":"","ref":[19,40],"car":"إِنَّا نَحْنُ نَرِثُ الْأَرْضَ وَمَنْ عَلَيْهَا وَإِلَيْنَا يُرْجَعُونَ"},{"n":98,"translit":"Ar-Rashîd","fr":"Celui qui dirige avec sagesse","sens":"Il oriente chaque chose vers sa juste fin et guide vers la droiture. Nom de la liste traditionnelle ; la racine « rushd » est très présente dans le Coran.","coran":"Les jeunes gens de la caverne : « Seigneur, accorde-nous de Ta part une miséricorde, et facilite-nous la droiture dans notre affaire. » — Al-Kahf, 18:10","rappel":"Quand tu ne sais plus quoi faire, demande à Allah le rashad : la bonne direction.","action":"Apprends la doua des gens de la caverne (18:10) et dis-la pour tes choix importants.","ar":"الرَّشِيدُ","flag":"trad","ref":[18,10],"car":"رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا"},{"n":99,"translit":"As-Sabûr","fr":"Le Patient","sens":"Il ne se hâte pas de punir ceux qui Lui désobéissent ; Il leur laisse le temps de revenir.","hadith":"« Personne n'est plus patient qu'Allah face à une offense entendue : on Lui attribue un enfant, et pourtant Il continue de leur accorder la santé et la subsistance. » — Al-Bukhârî 6099, Muslim 2804","rappel":"Si Allah est si patient avec nous, sois patient avec les autres. Et rappelle-toi : « Allah est avec les patients » (Al-Baqara, 2:153).","action":"Fais preuve de patience aujourd'hui dans une situation où tu t'énerves d'habitude.","ar":"الصَّبُورُ","flag":"","har":"مَا أَحَدٌ أَصْبَرُ عَلَى أَذًى سَمِعَهُ مِنَ اللَّهِ، يَدَّعُونَ لَهُ الْوَلَدَ، ثُمَّ يُعَافِيهِمْ وَيَرْزُقُهُمْ"}];

let AC=null;function blip(f=660,d=.07,v=.18,type='sine'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(v,AC.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}

function arVoices(){try{return speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang))}catch(e){return []}}
function bestVoice(){const L=arVoices();if(!L.length)return null;if(S.voice){const v=L.find(v=>v.name===S.voice);if(v)return v}
  return L.slice().sort((a,b)=>((VQ.test(b.name)?4:0)+(VPREF.test(b.name)?2:0)+(b.localService?0:1))-((VQ.test(a.name)?4:0)+(VPREF.test(a.name)?2:0)+(a.localService?0:1)))[0]}
function speak(x,btn){btn=btn||{classList:{add(){},remove(){}}};
  try{const ss=window.speechSynthesis;if(!ss)throw 0;ss.cancel();
    const u=new SpeechSynthesisUtterance((x.ar||'').replace(/[ۚۖۗ…·]/g,'،'));u.lang='ar-SA';u.rate=.78;u.pitch=1;
    const v=bestVoice();if(v){u.voice=v;u.lang=v.lang}else toast('Audio','Aucune voix arabe sur cet appareil. Va dans Réglages pour savoir comment en installer une naturelle.');
    btn.classList.add('playing');sayMark(btn);u.onend=u.onerror=()=>sayStop();ss.speak(u);
  }catch(e){toast('Audio','La lecture audio n\'est pas disponible ici.')}
}

const mqNormS=s=>{s=(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[-'’.,/()]/g,' ').replace(/\s+/g,' ').trim();return s.replace(/^st /,'saint ').replace(/^ste /,'sainte ')};

const tkOf=(la,lo)=>`${Math.floor(la/10)*10}_${Math.floor(lo/10)*10}`;
function kmD(a,b,c,d){const R=6371,x=rad(c-a),y=rad(d-b),h=Math.sin(x/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function mqNear(la,lo,maxKm=15,lim=40){const ks=new Set();for(const dl of [-.2,0,.2])for(const dg of [-.3,0,.3])ks.add(tkOf(la+dl,lo+dg));const all=[];for(const k of ks)(await mqTile(k)).forEach(m=>all.push(m));
 return all.map(m=>({m,d:kmD(la,lo,m[1],m[2])})).filter(x=>x.d<=maxKm).sort((x,y)=>x.d-y.d).slice(0,lim).map(x=>mqObj(x.m,x.d))}
const mqObj=(m,d)=>({uuid:`${m[1]},${m[2]}`,name:m[0],lat:m[1],lon:m[2],loc:[m[3],[m[5],m[4]].filter(Boolean).join(' ')].filter(Boolean).join(', '),city:m[4],dist:d});
async function mqCities(q){const n=mqNormS(q);if(n.length<2)return [];const b=/^[a-z]/.test(n)?n[0]:'_';if(!MQCI[b]){try{MQCI[b]=await (await fetch(`mosq/c_${b}.json`)).json()}catch(e){MQCI[b]=[]}}

async function mqCityList(c){const [nm,cnt,la,lo,pc,nc,g]=c,L=[];if(g==='g')return mqNear(la,lo,7,120);for(const dl of [-.3,0,.3])for(const dg of [-.3,0,.3]){const k=tkOf(la+dl,lo+dg);(await mqTile(k)).forEach(m=>{if(mqNormS(m[4])===nc&&kmD(la,lo,m[1],m[2])<40&&!L.some(x=>x.uuid===`${m[1]},${m[2]}`))L.push(mqObj(m,kmD(la,lo,m[1],m[2])))})}

function tzOff(ms,tz){try{const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-ms}catch(e){return -new Date(ms).getTimezoneOffset()*60000}}
function zDate(y,mo,d,hhmm,tz){const [h,m]=hhmm.split(':').map(Number);const g=Date.UTC(y,mo-1,d,h,m);let t=g-tzOff(g,tz);t=g-tzOff(t,tz);return new Date(t)}

const AL_KEYS=[['fajr','Fajr'],['sunrise','Sunrise'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];

function alGet(la,lo,d,any){const C=S.ptc||{};const y=d.getFullYear(),mo=d.getMonth()+1;let e=C[alKey(la,lo,y,mo)];if(!e&&any){const pre=la.toFixed(3)+'|'+lo.toFixed(3)+'|';const k=Object.keys(C).find(k=>k.startsWith(pre));e=k&&C[k]}if(!e)return null;if(any)return e;const r=e.days[d.getDate()];if(!r)return null;const out={};for(const [k] of AL_KEYS)out[k]=zDate(y,mo,d.getDate(),r[k],e.tz);out.tz=e.tz;out.at=e.at;return out}
let ALBUSY={},ALFAIL={};

function shLogo(x,W,H,side){if(!SHLOGO.complete||!SHLOGO.naturalWidth)return;const sz=Math.round(W*.115),m=Math.round(W*.075),xx=side==='l'?m:W-m-sz,yy=H-m-sz;x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=10;x.drawImage(SHLOGO,xx,yy,sz,sz);x.restore()}
function shDeco(x,W,H,k,acc){x.save();
 const star=(cx,cy,r,a)=>{x.beginPath();for(let i=0;i<16;i++){const rr=i%2?r*.42:r,an=Math.PI/8*i;x.lineTo(cx+rr*Math.cos(an),cy+rr*Math.sin(an))}x.closePath();x.globalAlpha=a;x.fill()};
 if(k==='nuit'||k==='lanternes'){x.fillStyle='#fff';for(let i=0;i<70;i++){const a=(i*97%W),b=(i*53%H)*.6;x.globalAlpha=.25+(i%5)*.1;x.beginPath();x.arc(a,b,(i%3)+1,0,7);x.fill()}x.globalAlpha=.9;x.fillStyle='#f3e2b3';x.beginPath();x.arc(W*.8,H*.13,48,0,7);x.fill();x.fillStyle=k==='nuit'?'#1b2a4a':'#2b1d47';x.beginPath();x.arc(W*.8+22,H*.13-14,44,0,7);x.fill()}
 if(k==='lanternes'){[[W*.16,0,H*.2],[W*.3,0,H*.12],[W*.72,0,H*.16]].forEach(([a,,l])=>{x.globalAlpha=.85;x.strokeStyle=acc;x.lineWidth=2;x.beginPath();x.moveTo(a,0);x.lineTo(a,l);x.stroke();x.fillStyle=acc;shRR(x,a-24,l,48,70,12);x.fill();x.fillStyle='#fff3c4';x.globalAlpha=.7;shRR(x,a-14,l+12,28,46,8);x.fill()})}
 if(k==='geo'||k==='beige'||k==='noiror'){x.fillStyle=acc;for(let i=0;i<W;i+=120)for(let j=0;j<H;j+=120)star(i+60,j+60,26,k==='beige'?.08:.1)}
 if(k==='mosquee'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(20,30,50,.0)');g.addColorStop(1,'rgba(20,30,50,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=.35;x.fillStyle='#1a2436';const b=H-40;x.fillRect(W*.2,b-160,W*.6,160);x.beginPath();x.arc(W/2,b-160,W*.16,Math.PI,0);x.fill();x.fillRect(W*.1,b-420,30,420);x.fillRect(W*.87,b-420,30,420);x.beginPath();x.moveTo(W*.1-6,b-420);x.lineTo(W*.1+15,b-470);x.lineTo(W*.1+36,b-420);x.fill();x.beginPath();x.moveTo(W*.87-6,b-420);x.lineTo(W*.87+15,b-470);x.lineTo(W*.87+36,b-420);x.fill()}
 if(k==='fleurs'||k==='rose'){const fl=(cx,cy,r)=>{for(let i=0;i<6;i++){x.beginPath();x.ellipse(cx+Math.cos(i)*r,cy+Math.sin(i)*r,r*.9,r*.5,i,0,7);x.fill()}};x.fillStyle=acc;x.globalAlpha=.14;fl(90,110,40);fl(W-100,H-200,52);fl(W-70,140,30);fl(70,H-260,34);x.globalAlpha=.1;x.strokeStyle=acc;x.lineWidth=3;x.beginPath();x.moveTo(0,H*.35);x.bezierCurveTo(W*.2,H*.3,W*.1,H*.15,W*.3,H*.05);x.stroke()}
 if(k==='emeraude'){x.strokeStyle=acc;x.globalAlpha=.18;x.lineWidth=2;for(let r=200;r<1400;r+=90){x.beginPath();x.arc(W/2,H*.42,r,0,7);x.stroke()}}
