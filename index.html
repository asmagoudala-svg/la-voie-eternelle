  else if(h==='coran'||/^coran-/.test(h)||/^sourate-\d+$/.test(h)){const r=qRoute(h);if(!r||r.redir)return;html=r.html;tab='coran';after=r.after}
  else if(h==='qibla'){PTAB='qibla';location.replace('#priere');return}
  else if(h==='priere'){html=priere();tab='priere';after=()=>{const qc=$('#qcity');qc&&(qc.onchange=e=>{const c=CITIES.find(c=>c[0]===e.target.value);S.qpos={name:c[0],lat:c[1],lon:c[2]};S.pchg=0;save();route()});const af=$('#adhfile');af&&(af.onchange=e=>{const f=e.target.files[0];if(f)adhSave(f)});qApply();clearInterval(PTICK);PTICK=setInterval(()=>{const el=$('#pcd');if(!el||location.hash!=='#priere'){clearInterval(PTICK);return}{const n0=nextPrayer();if(PTICK.last&&PTICK.last!==n0.k&&PS().alarms[PTICK.last]){adhPlay(null,PTICK.last==='fajr'?adhFajr():adhSel())}PTICK.last=n0.k}const n=nextPrayer();el.textContent='dans '+cdown(n.t)},15000)}}
  else if(h==='reglages'){html=reglages();tab='accueil'}
  else if(h==='sources'){html=sources();tab='accueil'}
  else html=home(),tab='accueil';
  $('#phone').classList.remove('mush','qtr');
  if(tab!=='coran'){qStop();qbStop();qSheetClose()}
  V.ontouchstart=V.ontouchend=V.onpointerdown=V.onpointerup=null;if(tab!=='coran')delete V.dataset.qs;V.innerHTML=html;V.scrollTop=0;$('#phone').classList.toggle('qon',tab==='coran');$('#phone').classList.toggle('light',S.theme==='light');$('#phone').classList.toggle('night',S.theme!=='light');after();if(!/^cat-/.test(h))0;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===tab));renderNav(tab);
}
V.addEventListener('click',e=>{
  const a=e.target.closest('a[data-jump]');if(a)JUMP=a.dataset.jump;
  if(e.target.closest('a[data-qjump]'))QJUMP=1;
  const t=e.target.closest('button,[role=button]');if(!t)return;const d=t.dataset;
  if(d.hd){HD=d.hd;const y=V.scrollTop;V.innerHTML=hadith();V.scrollTop=Math.min(y,200);return}
  if(d.wk){const z=dOf(HD||iso(new Date()));z.setDate(z.getDate()+ +d.wk);HD=iso(z);V.innerHTML=hadith();return}
  if(d.hread){S.hd[d.hread]=S.hd[d.hread]?0:today();save();if(S.hd[d.hread]){$('#celh').textContent='Hadith médité';$('#celp').textContent="Qu'Allah t'en fasse profiter et t'aide à le vivre aujourd'hui.";$('#cel').classList.add('on');$('#celx').onclick=()=>{$('#cel').classList.remove('on');V.innerHTML=hadith()}}else V.innerHTML=hadith();return}
  if('hcopy' in d){const x=hadithFor(HD);copy(`${x.t}\n\n${x.ar}\n\n${translit(x.ar)}\n\nLe Prophète ﷺ a dit : ${x.fr}\n\n${x.src} — ${GR[x.g][0]}`);return}
  if(d.cnt){const k=today()+'|'+d.cnt,n=+d.n;S.cnt[k]=Math.min((S.cnt[k]||0)+1,n);if((S.cnt[k]||0)>=n&&t.classList.contains('full')){S.cnt[k]=0}save();const c=S.cnt[k];t.classList.toggle('full',c>=n);if(t.classList.contains('tap'))t.innerHTML=`<b>${c}<small> / ${n}</small></b><span>${c>=n?'Accompli aujourd\'hui · touche pour recommencer':'Touche à chaque répétition'}</span>`;else t.textContent=(c>=n?'✓ ':'')+c+' / '+n;if(c===n){try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}toast('Accompli','Qu\'Allah l\'accepte de toi.')}return}
  if((d.say||d.sayar)&&t.classList.contains('playing')){sayStop();return}
  if(d.say){sayStop();const x=duaByKey(d.say),rf=x.g==='q'?refOf(x.src):null;if(rf){recite(rf,t,x.ar);return}speak(x,t);return}
  if(d.fav){S.fav[d.fav]=!S.fav[d.fav];save();t.innerHTML=SVGS.heart(S.fav[d.fav]);toast(S.fav[d.fav]?'Ajoutée aux favorites':'Retirée des favorites',duaByKey(d.fav).t);return}
  if(d.dcopy){const x=duaByKey(d.dcopy);copy(`${x.t}\n\n${x.ar}\n\n${x.fr}\n\n${x.src} — ${GR[x.g][0]}`);return}
  if(d.stage){const el=document.getElementById('st-'+d.stage);el&&el.scrollIntoView({behavior:'smooth'});return}
  if(d.go){if(d.adv&&+d.adv>S.cur&&S.done[S.cur]){S.cur=+d.adv;save()}location.hash=d.go;return}
  if('back' in d){STK.pop();const p=STK.pop()||'accueil';location.hash=p;return}
  if(d.scope){R.scope=d.scope;route();return}
  if(d.mode){start(d.mode);route();return}
  if('quit' in d){R.mode=null;R.stage=0;route();return}
  if('again' in d){start(R.stage?'etape':R.mode,R.stage);route();return}
  if(t.id==='fc'){R.flip=!R.flip;t.classList.toggle('flip');return}
  if(d.fc){const x=R.qs[R.i];mark(x.n,d.fc==='1');if(d.fc==='1')R.ok++;R.i++;R.flip=false;V.innerHTML=session();return}
  if(d.opt){const i=+d.opt,x=R.qs[R.i];if(R.ans!==null)return;if(R.opts[i].n===x.n){R.ans=i;const first=!(R.wrong||[]).length;if(first)R.ok++;mark(x.n,first);V.innerHTML=session();clearTimeout(R.tm);R.tm=setTimeout(()=>{if(!R.mode||R.mode==='suivi'||location.hash!=='#reviser')return;R.i++;R.ans=null;R.wrong=[];V.innerHTML=session();V.scrollTop=0},1300)}else{R.wrong=[...(R.wrong||[]),i];try{navigator.vibrate&&navigator.vibrate(40)}catch(_){}V.innerHTML=session()}return}
  if(d.tz){tasTap();return}
  if(d.ts){const T=S.tas;blip(880,.05,.12,'triangle');if(d.ts==='play'){speak({ar:TS[T.i].ar},t);return}if(d.ts==='vib'){T.vib=!T.vib;save();t.classList.toggle('on',T.vib);toast('Vibration',T.vib?'Activée':'Désactivée');return}if(d.ts==='lock'){T.lock=!T.lock;save();V.innerHTML=tasbih();toast(T.lock?'Verrouillé':'Déverrouillé',T.lock?'Seul le compteur reste actif.':'Tu peux changer de formule.');return}if(d.ts==='reset'){if(T.lock){toast('Verrouillé','Déverrouille pour remettre à zéro.');return}T.count=0;T.rounds=0;save();V.innerHTML=tasbih();return}}
  if(d.tsi){const T=S.tas;if(T.lock){toast('Verrouillé','Déverrouille pour changer de formule.');return}T.i=+d.tsi;T.target=TS[T.i].t;T.count=0;T.rounds=0;save();blip(700,.06,.14);V.innerHTML=tasbih();return}
  if(d.tgt!==undefined){const T=S.tas;if(T.lock){toast('Verrouillé','Déverrouille pour changer d\'objectif.');return}T.target=+d.tgt;T.count=0;save();blip(523+(+d.tgt||120)*2,.09,.18);V.innerHTML=tasbih();return}
  if(d.locked){toast('Étape verrouillée',`Réussis le quiz de l'étape ${d.locked-1} à 10/10 pour la débloquer.`);return}
  if(d.rec){recite(d.rec.split(':').map(Number),t,d.fb);return}
  if(d.voice){S.voice=d.voice;save();const y=V.scrollTop;route();V.scrollTop=y;speak({ar:'بِسْمِ اللَّهِ'});return}
  if('qgeo' in d){qGeo();return}
  if(d.mcaldel&&S.mosq){delete S.mosq.calendar;save();route();return}
  if(d.mqopen){mqSheet();return}
  if(d.mqadj){mqAdjSheet();return}
  if(d.mqfav){const f=S.mosqfav.find(x=>x.uuid==d.mqfav);S.mosq=f;save();const y=V.scrollTop;route();V.scrollTop=y;return}
  if(d.theme){S.theme=S.theme==='light'?'dark':'light';save();const y=V.scrollTop;route();V.scrollTop=y;return}
  if(d.ptab){PTAB=d.ptab;blip(700,.05,.12);route();return}
  if('pchg' in d){S.pchg=!S.pchg;save();route();return}
  if(d.pasr){S.pr=Object.assign(PS(),{asr:+d.pasr});save();route();return}
  if(d.adhplay!==undefined){adhPlay(t,d.adhplay||adhSel());return}
  if(d.adhprev){adhPlay(t,d.adhprev);return}
  if(d.adhpick){if(ADHFOR==='fajr')S.adhf=d.adhpick;else S.adh=d.adhpick;save();blip(700,.05,.12);const y=V.scrollTop;route();V.scrollTop=y;return}
  if(d.adhfor){ADHFOR=d.adhfor;const y=V.scrollTop;route();V.scrollTop=y;return}
  if(d.iq){const c=PS(),k=d.iq,L=[0,5,10,15,20,25,30];c.iq[k]=L[(L.indexOf(c.iq[k]||10)+1)%L.length];S.pr=c;save();blip(660,.05,.12);const y=V.scrollTop;route();V.scrollTop=y;toast('Iqâma',`${PN.find(p=>p[0]===k)[1]} : ${c.iq[k]} min après l'adhan.`);return}
  if(d.alarm){const c=PS();c.alarms[d.alarm]=!c.alarms[d.alarm];S.pr=c;save();const y=V.scrollTop;route();V.scrollTop=y;toast('Adhan',c.alarms[d.alarm]?`Adhan activé pour ${PN.find(p=>p[0]===d.alarm)[1]}.`:`Adhan coupé pour ${PN.find(p=>p[0]===d.alarm)[1]}.`);return}
  if('qcomp' in d){qCompass();return}
  if(d.stab){R.tab=d.stab;V.innerHTML=session();return}
  if(d.tog){const k=+d.tog,cs=stageOf(S.cur);const cur=S.open[k]!==undefined?S.open[k]:k===cs;S.open[k]=!cur;save();const y=V.scrollTop;route();V.scrollTop=y;return}
  if(d.lang){S.lang=d.lang;save();const y=V.scrollTop;route();V.scrollTop=y;return}
  if(d.sayar){sayStop();speak({ar:d.sayar},t);return}
  if('next' in d){R.i++;R.ans=null;V.innerHTML=session();V.scrollTop=0;return}
  if(d.nt){S.notif[d.nt].on=t.checked;save();return}
  if('demo' in d){const x=D[S.cur-1];toast('La Voie Éternelle · 07:30',`Ton nom du jour t'attend : ${x.translit}, ${x.fr}.`);return}
  if('perm' in d){try{if(!('Notification' in window))throw 0;Notification.requestPermission().then(p=>toast('Notifications',p==='granted'?'Autorisées pour ce navigateur.':'Non autorisées : tu peux les activer plus tard.')).catch(()=>toast('Notifications','Indisponibles dans cet aperçu.'))}catch(_){toast('Notifications','Indisponibles dans cet aperçu : elles seront natives dans l\'app.')}return}
  if('reset' in d){confirmDlg('Réinitialiser ?','Ta progression, tes révisions et ton journal seront effacés de cet appareil. Cette action est définitive.',()=>{S=fresh();save();location.hash='accueil';route();toast('Nouveau départ','Bismillah : le parcours recommence au jour 1.')});return}
});
V.addEventListener('change',e=>{const t=e.target;if(t.dataset.nt){S.notif[t.dataset.nt].on=t.checked;save();toast('Rappels',t.checked?'Rappel activé.':'Rappel désactivé.')}if(t.id==='t-matin'||t.id==='t-soir'){S.notif[t.id.slice(2)].t=t.value;save()}});
V.addEventListener('keydown',e=>{if(e.target.id==='fc'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});
addEventListener('hashchange',route);
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(location.hash==='#reglages')route()}}catch(e){}
route();
}
